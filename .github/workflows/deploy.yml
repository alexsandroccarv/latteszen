name: Publicar lattesZen

# Quando roda:
#  - a cada push na branch padrão do projeto;
#  - quando você clica em "Run workflow" na aba Actions (execução manual).
on:
  push:
    branches: ['principal']
  workflow_dispatch: {}

permissions:
  contents: read

# Evita dois deploys simultâneos pisando um no outro.
concurrency:
  group: publicar
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Validar, construir e publicar
    runs-on: ubuntu-latest
    # Rede de segurança: sem isto, um hang de verdade na suíte de testes (já
    # aconteceu — runner preso por mais de 1h sem nenhum log de erro) deixa o
    # job rodando por até 6h (limite padrão do GitHub Actions), consumindo
    # minutos de CI à toa. Pipeline historicamente em ~3-8min (issue #119,
    # causa raiz do selo de DOI do Zenodo travando a CDN bloqueada, já
    # corrigida). Ampliado de 20 pra 35min quando a suíte passou de 300
    # testes; com a suíte agora em 330+ o passo de testes voltou a bater
    # exatamente nos 35min por 2 execuções (sempre passando de primeira ao
    # reexecutar — sinal de rede/runner mais lento naquele momento, não de
    # regressão no código) — ampliado de novo, pra 50min, mesma lógica.
    timeout-minutes: 50
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar sintaxe dos módulos JS
        run: for f in src/js/*.js; do node --check "$f"; done

      - name: Instalar dependências de teste (Playwright)
        run: npm ci

      - name: Instalar o navegador do Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Rodar a suíte de testes de regressão (UI, Playwright)
        run: npm test

      - name: Garantir xmllint disponível (validação de XML)
        run: command -v xmllint >/dev/null || (sudo apt-get update && sudo apt-get install -y libxml2-utils)

      - name: Validar exportação XML contra o schema oficial (XSD/DTD)
        run: npm run test:xml

      - name: Montar a pasta publicável (dist/)
        run: node build.mjs

      - name: Conferir a estrutura do dist/
        run: |
          test -f dist/index.html   || { echo "ERRO: dist/index.html ausente."; exit 1; }
          test -f dist/js/app.js    || { echo "ERRO: dist/js/ ausente.";        exit 1; }
          test -f dist/css/styles.css || { echo "ERRO: dist/css/ ausente.";      exit 1; }

      # Publica no servidor via rsync sobre SSH. O script PULA automaticamente
      # (sem falhar) se os secrets ainda não estiverem configurados — então o
      # CI fica verde mesmo antes de você cadastrar os dados do servidor.
      - name: Publicar no servidor (rsync/SSH)
        run: bash .github/scripts/deploy.sh
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
