<script>
/* ===== js/encoding.js ===== */
/* ==========================================================================
   lattesZen — Camada de CODIFICAÇÃO (compatibilidade com o Lattes)
   --------------------------------------------------------------------------
   O Currículo Lattes usa ISO-8859-1 (Latin-1). Internamente o lattesZen
   trabalha com strings Unicode (JS/UTF-16) e persiste em JSON/UTF-8 — o que é
   lossless. As conversões acontecem nas BORDAS:

     ENTRADA  (import XML):  bytes ISO-8859-1 → string Unicode  (decodeBuffer)
     SAÍDA    (export XML):  string Unicode  → bytes ISO-8859-1 (encodeLatin1Xml)

   Como um documento ISO-8859-1 não representa caracteres acima de U+00FF,
   na saída esses caracteres são emitidos como ENTIDADES NUMÉRICAS XML (&#N;),
   que são válidas independentemente do encoding do documento. Também há um
   normalizador de pontuação (aspas curvas, travessão, reticências…) para
   manter o texto limpo e reduzir o uso de entidades.
   ========================================================================== */
window.LzEncoding = (function () {

    /* ----------------------------- ENTRADA ------------------------------- */
    // Detecta o encoding declarado no cabeçalho XML (default utf-8) e decodifica.
    function detectEncoding(buffer) {
        const head = new TextDecoder('ascii').decode(new Uint8Array(buffer.slice(0, 200)));
        const m = head.match(/encoding=["']([^"']+)["']/i);
        return (m ? m[1] : 'utf-8').toLowerCase();
    }
    function decodeBuffer(buffer, encoding) {
        const enc = encoding || detectEncoding(buffer);
        try { return new TextDecoder(enc).decode(buffer); }
        catch (_) { return new TextDecoder('iso-8859-1').decode(buffer); }
    }
    async function decodeXmlFile(file) {
        return decodeBuffer(await file.arrayBuffer());
    }

    /* --------------------------- NORMALIZAÇÃO ---------------------------- */
    // Mapeia pontuação Unicode comum para equivalentes representáveis em Latin-1.
    const NORM = {
        '‘': "'", '’': "'", '‚': "'", '‛': "'",   // aspas simples curvas
        '“': '"', '”': '"', '„': '"', '‟': '"',   // aspas duplas curvas
        '–': '-', '—': '-', '―': '-', '−': '-',   // travessões / menos
        '…': '...',                                              // reticências
        ' ': ' ', ' ': ' ', ' ': ' ',                  // espaços especiais
        '•': '-', 'ʼ': "'", '⁄': '/',
    };
    const NORM_RE = new RegExp('[' + Object.keys(NORM).join('') + ']', 'g');
    function normalizePunctuation(s) {
        return String(s == null ? '' : s).replace(NORM_RE, c => NORM[c] || c);
    }

    /* ----------------------------- VALIDAÇÃO ----------------------------- */
    // Retorna a lista de caracteres fora do ISO-8859-1 (code point > 255).
    function findNonLatin1(s) {
        const out = [];
        for (const ch of String(s == null ? '' : s)) {
            const cp = ch.codePointAt(0);
            if (cp > 255) out.push({ ch, cp });
        }
        return out;
    }
    function isLatin1Compatible(s) { return findNonLatin1(s).length === 0; }

    /* ------------------------------ SAÍDA -------------------------------- */
    // Escapa caracteres reservados de XML.
    function xmlEscape(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
    }
    // String Unicode → string cujos caracteres são todos ≤ U+00FF (os demais
    // viram entidade numérica &#N;), pronta para virar bytes Latin-1.
    function toLatin1XmlString(s) {
        let out = '';
        for (const ch of String(s == null ? '' : s)) {
            const cp = ch.codePointAt(0);
            out += cp > 255 ? `&#${cp};` : ch;
        }
        return out;
    }
    // Empacota uma string (já ≤255 por caractere) em bytes ISO-8859-1.
    function latin1Bytes(s) {
        const bytes = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i) & 0xFF;
        return bytes;
    }
    // Conversor de SAÍDA completo: texto Unicode → Uint8Array em ISO-8859-1
    // (com entidades numéricas para o que estiver fora do Latin-1).
    function encodeLatin1Xml(s) {
        return latin1Bytes(toLatin1XmlString(s));
    }
    // Serializa um documento XML inteiro para Blob ISO-8859-1 (uso futuro no
    // exportador para o Lattes). Recebe a string XML já montada.
    function xmlBlobLatin1(xmlString) {
        return new Blob([encodeLatin1Xml(xmlString)], { type: 'application/xml' });
    }

    return {
        // entrada
        detectEncoding, decodeBuffer, decodeXmlFile,
        // normalização / validação
        normalizePunctuation, findNonLatin1, isLatin1Compatible,
        // saída
        xmlEscape, toLatin1XmlString, latin1Bytes, encodeLatin1Xml, xmlBlobLatin1,
    };
})();

</script>

   ========================================================================== */

const AL_LOCAL = { key: 'local', label: 'Local / Cidade', type: 'text' };

<script>
/* ===== js/storage.js ===== */
/* ==========================================================================
   lattesZen — Camada de armazenamento
   --------------------------------------------------------------------------
   - Índice do catálogo: localStorage (chave lz_catalog) — funciona sempre.
   - Arquivos (ID.pdf / ID.json): File System Access API, num diretório
     escolhido pelo usuário e persistido no IndexedDB (o handle é
     estruturável-clonável e sobrevive entre sessões, mediante permissão).
   ========================================================================== */
window.Storage = (function () {
    const K = APP_CONFIG.storageKeys;
    const IDB_NAME = 'lattesZen';
    const IDB_STORE = 'handles';
    const IDB_KEY = 'dirHandle';

    /* ---------------- IndexedDB (guarda o handle do diretório) ------------- */
    function idb() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }
    async function idbSet(key, val) {
        const db = await idb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }
    async function idbGet(key) {
        const db = await idb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readonly');
            const r = tx.objectStore(IDB_STORE).get(key);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
        });
    }
    async function idbDel(key) {
        const db = await idb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).delete(key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    /* -------------------------- Diretório (FS Access) --------------------- */
    let dirHandle = null;

    const supportsFS = 'showDirectoryPicker' in window;

    async function verifyPermission(handle, readWrite = true) {
        const opts = { mode: readWrite ? 'readwrite' : 'read' };
        if ((await handle.queryPermission(opts)) === 'granted') return true;
        if ((await handle.requestPermission(opts)) === 'granted') return true;
        return false;
    }

    async function chooseDirectory() {
        if (!supportsFS) throw new Error('Navegador sem suporte à File System Access API (use Chrome ou Edge).');
        const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
        dirHandle = handle;
        await idbSet(IDB_KEY, handle);
        return handle;
    }

    // Restaura o handle salvo (sem pedir permissão automaticamente)
    async function restoreDirectory() {
        if (!supportsFS) return null;
        const handle = await idbGet(IDB_KEY);
        if (handle) dirHandle = handle;
        return handle || null;
    }

    async function ensureDirReady() {
        if (!dirHandle) throw new Error('Nenhum diretório configurado. Vá em Configurações e escolha uma pasta.');
        const ok = await verifyPermission(dirHandle, true);
        if (!ok) throw new Error('Permissão de escrita negada para o diretório.');
        return dirHandle;
    }

    function hasDirectory() { return !!dirHandle; }
    async function directoryName() { return dirHandle ? dirHandle.name : null; }

    async function forgetDirectory() {
        dirHandle = null;
        await idbDel(IDB_KEY);
    }

    /* -------------------------- Escrita de arquivos ---------------------- */
    // Cria os subdiretórios (um por categoria) dentro da pasta escolhida
    async function ensureSubdirs(names) {
        const dir = await ensureDirReady();
        for (const name of names) {
            try { await dir.getDirectoryHandle(name, { create: true }); } catch (_) {}
        }
    }

    // Resolve o diretório-alvo: a raiz ou um subdiretório (criado se necessário)
    async function targetDir(subdir) {
        const dir = await ensureDirReady();
        if (!subdir) return dir;
        return dir.getDirectoryHandle(subdir, { create: true });
    }

    async function writeFile(filename, data, subdir) {
        const dir = await targetDir(subdir);
        const fh = await dir.getFileHandle(filename, { create: true });
        const w = await fh.createWritable();
        await w.write(data);
        await w.close();
    }

    async function writeJson(id, obj, subdir) {
        await writeFile(`${id}.json`, JSON.stringify(obj, null, 2), subdir);
    }

    const ATTACH_EXTS = ['pdf', 'jpg', 'jpeg', 'png'];

    // Grava o anexo (PDF ou imagem) com a extensão informada; remove versões
    // anteriores com outra extensão para não duplicar (ex.: trocar PDF por PNG).
    async function writeAttachment(id, fileOrBlob, subdir, ext) {
        ext = (ext || 'pdf').toLowerCase();
        for (const e of ATTACH_EXTS) if (e !== ext) {
            try { const d = await targetDir(subdir); await d.removeEntry(`${id}.${e}`); } catch (_) {}
        }
        await writeFile(`${id}.${ext}`, fileOrBlob, subdir);
    }

    async function deleteFiles(id, subdir) {
        if (!dirHandle) return;
        let dir = dirHandle;
        if (subdir) { try { dir = await dirHandle.getDirectoryHandle(subdir); } catch (_) { return; } }
        for (const ext of ATTACH_EXTS.concat('json')) {
            try { await dir.removeEntry(`${id}.${ext}`); } catch (_) { /* pode não existir */ }
        }
    }

    async function readAttachmentUrl(id, subdir, ext) {
        const dir = await ensureDirReady();
        let target = dir;
        if (subdir) { try { target = await dir.getDirectoryHandle(subdir); } catch (_) { return null; } }
        const tryExts = ext ? [ext.toLowerCase()] : ATTACH_EXTS;
        for (const e of tryExts) {
            try {
                const fh = await target.getFileHandle(`${id}.${e}`);
                const file = await fh.getFile();
                return URL.createObjectURL(file);
            } catch (_) { /* tenta próxima */ }
        }
        return null;
    }

    // Reconstrói o catálogo a partir dos *.json (raiz e subdiretórios de categoria)
    async function scanDirectory() {
        const dir = await ensureDirReady();
        const items = [];
        async function scanOne(handle) {
            for await (const [name, h] of handle.entries()) {
                if (h.kind === 'file' && name.toLowerCase().endsWith('.json') && name !== 'catalogo.json' && name.indexOf('latteszen-') !== 0) {
                    try {
                        const file = await h.getFile();
                        const obj = JSON.parse(await file.text());
                        if (obj && obj.id) items.push(obj);
                    } catch (_) { /* ignora inválidos */ }
                } else if (h.kind === 'directory') {
                    try { await scanOne(h); } catch (_) {}
                }
            }
        }
        await scanOne(dir);
        return items;
    }

    /* ----------------------- Catálogo (localStorage) --------------------- */
    function loadCatalog() {
        try { return JSON.parse(localStorage.getItem(K.catalog)) || []; }
        catch (_) { return []; }
    }
    function saveCatalog(items) {
        localStorage.setItem(K.catalog, JSON.stringify(items));
    }

    /* ----------------------- Configurações gerais ------------------------ */
    function loadSettings() {
        try { return JSON.parse(localStorage.getItem(K.settings)) || {}; }
        catch (_) { return {}; }
    }
    function saveSettings(s) {
        localStorage.setItem(K.settings, JSON.stringify(s));
    }

    return {
        supportsFS,
        // diretório
        chooseDirectory, restoreDirectory, ensureDirReady, hasDirectory,
        directoryName, forgetDirectory, verifyPermission,
        // arquivos
        writeJson, writeAttachment, deleteFiles, readAttachmentUrl, scanDirectory, ensureSubdirs,
        // catálogo + settings
        loadCatalog, saveCatalog, loadSettings, saveSettings,
    };
})();

</script>
<script>
/* ===== js/lattes-xml.js ===== */
/* ==========================================================================
   lattesZen — Importador do XML do Currículo Lattes
   --------------------------------------------------------------------------
   Faz o parse do XML exportado pela Plataforma Lattes (CNPq) e mapeia as
   seções para os tipos internos (lattes-types.js). Nomes de tags e atributos
   seguem o schema oficial CurriculoLattes (ver CurriculoLattes.xsd).

   Estratégia: cada tipo-folha tem exatamente um grupo "DADOS-BASICOS-*" e um
   "DETALHAMENTO-*"; localizamos esses grupos por PREFIXO, o que evita
   enumerar dezenas de nomes de grupo. Título/ano/DOI variam de nome por
   seção, então usamos listas de candidatos.
   ========================================================================== */
window.LattesXML = (function () {

    /* ------------------------------ helpers ------------------------------ */
    function attrs(el) {
        const o = {};
        if (!el) return o;
        for (const a of el.attributes) o[a.name] = a.value;
        return o;
    }
    function firstTag(el, tag) { return el ? (el.getElementsByTagName(tag)[0] || null) : null; }
    // Atributos do primeiro filho DIRETO cujo nome começa com `prefix`
    function groupByPrefix(el, prefix) {
        if (!el) return {};
        for (const c of el.children) {
            if (c.tagName && c.tagName.indexOf(prefix) === 0) return attrs(c);
        }
        return {};
    }
    function pick(obj, ...keys) {
        for (const k of keys) if (obj[k] != null && obj[k] !== '') return obj[k];
        return '';
    }
    function paginas(d) {
        return [d['PAGINA-INICIAL'], d['PAGINA-FINAL']].filter(Boolean).join('-');
    }
    function humanize(v) {
        return v ? v.replace(/_/g, ' ').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()) : '';
    }

    const TITLE_KEYS = ['TITULO-DO-ARTIGO', 'TITULO-DO-LIVRO', 'TITULO-DO-CAPITULO-DO-LIVRO',
        'TITULO-DO-TRABALHO-TECNICO', 'TITULO-DO-TRABALHO', 'TITULO-DO-TEXTO', 'TITULO-DO-SOFTWARE',
        'TITULO-DO-PRODUTO', 'TITULO-DO-PROCESSO', 'DENOMINACAO', 'TITULO'];
    const YEAR_KEYS = ['ANO-DO-ARTIGO', 'ANO-DO-TRABALHO', 'ANO-DO-TEXTO', 'ANO', 'ANO-DESENVOLVIMENTO',
        'ANO-SOLICITACAO', 'ANO-DA-PREMIACAO', 'ANO-DE-OBTENCAO-DO-TITULO', 'ANO-DE-CONCLUSAO'];

    function titleOf(b) { return pick(b, ...TITLE_KEYS); }
    function yearOf(b) { return pick(b, ...YEAR_KEYS); }

    // Coleta autores (grupo repetível AUTORES)
    function autoresOf(el) {
        const nomes = [];
        for (const a of el.getElementsByTagName('AUTORES')) {
            const at = attrs(a);
            const n = at['NOME-COMPLETO-DO-AUTOR'] || at['NOME-PARA-CITACAO'];
            if (n) nomes.push(n);
        }
        return nomes.join('; ');
    }

    /* ---------------------- mapas de enumeração --------------------------- */
    const PROF_MAP = { BEM: 'Bom', RAZOAVELMENTE: 'Razoável', POUCO: 'Pouco' };
    const NAT_TRABALHO = { COMPLETO: 'Completo', RESUMO: 'Resumo', RESUMO_EXPANDIDO: 'Resumo expandido' };
    const NAT_LIVRO = { LIVRO_PUBLICADO: 'Livro publicado', LIVRO_ORGANIZADO_OU_EDICAO: 'Livro organizado' };

    const ORIENT_MAP = {
        'ORIENTACOES-CONCLUIDAS-PARA-MESTRADO':          { tipo: 'Mestrado', situacao: 'Concluída' },
        'ORIENTACOES-CONCLUIDAS-PARA-DOUTORADO':         { tipo: 'Doutorado', situacao: 'Concluída' },
        'ORIENTACOES-CONCLUIDAS-PARA-POS-DOUTORADO':     { tipo: 'Pós-Doutorado', situacao: 'Concluída' },
        'OUTRAS-ORIENTACOES-CONCLUIDAS':                 { tipo: 'Outra', situacao: 'Concluída' },
        'ORIENTACAO-EM-ANDAMENTO-DE-MESTRADO':           { tipo: 'Mestrado', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-DOUTORADO':          { tipo: 'Doutorado', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-POS-DOUTORADO':      { tipo: 'Pós-Doutorado', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-APERFEICOAMENTO-ESPECIALIZACAO': { tipo: 'Especialização / Monografia', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-GRADUACAO':          { tipo: 'TCC / Graduação', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-INICIACAO-CIENTIFICA': { tipo: 'Iniciação científica', situacao: 'Em andamento' },
        'OUTRAS-ORIENTACOES-EM-ANDAMENTO':               { tipo: 'Outra', situacao: 'Em andamento' },
    };

    const PARTIC_MAP = {
        'PARTICIPACAO-EM-CONGRESSO': 'Congresso', 'PARTICIPACAO-EM-FEIRA': 'Feira',
        'PARTICIPACAO-EM-SEMINARIO': 'Seminário', 'PARTICIPACAO-EM-SIMPOSIO': 'Simpósio',
        'PARTICIPACAO-EM-OFICINA': 'Oficina', 'PARTICIPACAO-EM-ENCONTRO': 'Encontro',
        'PARTICIPACAO-EM-EXPOSICAO': 'Exposição', 'PARTICIPACAO-EM-OLIMPIADA': 'Olimpíada',
        'OUTRAS-PARTICIPACOES-EM-EVENTOS-CONGRESSOS': 'Outro',
    };

    const BANCA_MAP = {
        'PARTICIPACAO-EM-BANCA-DE-MESTRADO': 'Mestrado',
        'PARTICIPACAO-EM-BANCA-DE-DOUTORADO': 'Doutorado',
        'PARTICIPACAO-EM-BANCA-DE-EXAME-QUALIFICACAO': 'Qualificação',
        'PARTICIPACAO-EM-BANCA-DE-APERFEICOAMENTO-ESPECIALIZACAO': 'Especialização / Aperfeiçoamento',
        'PARTICIPACAO-EM-BANCA-DE-GRADUACAO': 'TCC / Graduação',
        'OUTRAS-PARTICIPACOES-EM-BANCA': 'Outra',
        'BANCA-JULGADORA-PARA-PROFESSOR-TITULAR': 'Professor titular',
        'BANCA-JULGADORA-PARA-CONCURSO-PUBLICO': 'Concurso público',
        'BANCA-JULGADORA-PARA-LIVRE-DOCENCIA': 'Livre-docência',
        'BANCA-JULGADORA-PARA-AVALIACAO-CURSOS': 'Avaliação de cursos',
        'OUTRAS-BANCAS-JULGADORAS': 'Outra',
    };

    const FORMACAO_MAP = {
        'GRADUACAO': 'Graduação', 'ESPECIALIZACAO': 'Especialização', 'APERFEICOAMENTO': 'Aperfeiçoamento',
        'MESTRADO': 'Mestrado', 'MESTRADO-PROFISSIONALIZANTE': 'Mestrado',
        'DOUTORADO': 'Doutorado', 'POS-DOUTORADO': 'Pós-Doutorado',
        'LIVRE-DOCENCIA': 'Livre-docência', 'RESIDENCIA-MEDICA': 'Residência médica',
        'CURSO-TECNICO-PROFISSIONALIZANTE': 'Curso técnico',
        'ENSINO-FUNDAMENTAL-PRIMEIRO-GRAU': 'Ensino fundamental', 'ENSINO-MEDIO-SEGUNDO-GRAU': 'Ensino médio',
    };

    /* -------------------- handlers por tag (produção) -------------------- */
    // Cada handler: { tags:[...], typeKey, map(el,b,d) -> fields }
    const HANDLERS = [
        { tags: ['ARTIGO-PUBLICADO'], typeKey: 'ARTIGO_PERIODICO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), doi: b['DOI'] || '', autores: autoresOf(el),
              periodico: d['TITULO-DO-PERIODICO-OU-REVISTA'] || '', issn: d['ISSN'] || '',
              volume: d['VOLUME'] || '', fasciculo: d['FASCICULO'] || '', paginas: paginas(d),
          }) },
        { tags: ['ARTIGO-ACEITO-PARA-PUBLICACAO'], typeKey: 'ARTIGO_ACEITO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), doi: b['DOI'] || '', autores: autoresOf(el),
              periodico: d['TITULO-DO-PERIODICO-OU-REVISTA'] || '', issn: d['ISSN'] || '',
          }) },
        { tags: ['LIVRO-PUBLICADO-OU-ORGANIZADO'], typeKey: 'LIVRO_CAPITULO',
          map: (el, b, d) => ({
              tipoObra: NAT_LIVRO[b['TIPO']] || 'Livro publicado',
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              editora: d['NOME-DA-EDITORA'] || '', cidade: d['CIDADE-DA-EDITORA'] || '',
              isbn: d['ISBN'] || '', edicao: d['NUMERO-DA-EDICAO-REVISAO'] || '', paginas: d['NUMERO-DE-PAGINAS'] || '',
          }) },
        { tags: ['CAPITULO-DE-LIVRO-PUBLICADO'], typeKey: 'LIVRO_CAPITULO',
          map: (el, b, d) => ({
              tipoObra: 'Capítulo de livro',
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              tituloLivro: d['TITULO-DO-LIVRO'] || '', organizadores: d['ORGANIZADORES'] || '',
              editora: d['NOME-DA-EDITORA'] || '', isbn: d['ISBN'] || '', paginas: paginas(d),
          }) },
        { tags: ['TRABALHO-EM-EVENTOS'], typeKey: 'TRABALHO_EVENTO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), doi: b['DOI'] || '', autores: autoresOf(el),
              natureza: NAT_TRABALHO[b['NATUREZA']] || humanize(b['NATUREZA']),
              evento: d['NOME-DO-EVENTO'] || '', anais: d['TITULO-DOS-ANAIS-OU-PROCEEDINGS'] || '',
              cidade: d['CIDADE-DO-EVENTO'] || '', paginas: paginas(d),
          }) },
        { tags: ['TEXTO-EM-JORNAL-OU-REVISTA'], typeKey: 'TEXTO_JORNAL',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              veiculo: d['TITULO-DO-JORNAL-OU-REVISTA'] || '', data: d['DATA-DE-PUBLICACAO'] || '', paginas: paginas(d),
          }) },

        // ---- Produção técnica ----
        { tags: ['SOFTWARE'], typeKey: 'SOFTWARE_SEM_REGISTRO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              plataforma: d['PLATAFORMA'] || d['AMBIENTE'] || '', finalidade: d['FINALIDADE'] || b['FINALIDADE'] || '',
          }) },
        { tags: ['PATENTE'], typeKey: 'PATENTE',
          map: (el, b, d) => {
              const reg = attrs(firstTag(el, 'REGISTRO-OU-PATENTE'));
              return {
                  titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
                  categoria: d['CATEGORIA'] || '', finalidade: d['FINALIDADE'] || '',
                  registro: reg['CODIGO-DO-REGISTRO-OU-PATENTE'] || '', instituicao: d['INSTITUICAO-FINANCIADORA'] || '',
              };
          } },
        { tags: ['DESENHO-INDUSTRIAL'], typeKey: 'DESENHO_INDUSTRIAL',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              finalidade: d['FINALIDADE'] || '', instituicao: d['INSTITUICAO-FINANCIADORA'] || '',
          }) },
        { tags: ['MARCA'], typeKey: 'MARCA',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              natureza: humanize(d['NATUREZA']), finalidade: d['FINALIDADE'] || '',
          }) },
        { tags: ['CULTIVAR-REGISTRADA'], typeKey: 'CULTIVAR_REGISTRADA',
          map: (el, b, d) => ({
              titulo: b['DENOMINACAO'] || titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              finalidade: d['FINALIDADE'] || '', instituicao: d['INSTITUICAO-FINANCIADORA'] || '',
          }) },
        { tags: ['CULTIVAR-PROTEGIDA'], typeKey: 'CULTIVAR_PROTEGIDA',
          map: (el, b, d) => ({
              titulo: b['DENOMINACAO'] || titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              finalidade: d['FINALIDADE'] || '', instituicao: d['INSTITUICAO-FINANCIADORA'] || '',
          }) },
        { tags: ['TOPOGRAFIA-DE-CIRCUITO-INTEGRADO'], typeKey: 'TOPOGRAFIA_CI',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              finalidade: d['FINALIDADE'] || '', instituicao: d['INSTITUICAO-FINANCIADORA'] || '',
          }) },
        { tags: ['PRODUTO-TECNOLOGICO'], typeKey: 'PRODUTO_TECNOLOGICO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              finalidade: d['FINALIDADE'] || '',
          }) },
        { tags: ['PROCESSOS-OU-TECNICAS'], typeKey: 'PROCESSO_TECNICA',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              natureza: humanize(b['NATUREZA']), finalidade: d['FINALIDADE'] || '',
              instituicao: d['INSTITUICAO-FINANCIADORA'] || '', cidade: d['CIDADE-DO-PROCESSO'] || '',
          }) },
        { tags: ['TRABALHO-TECNICO'], typeKey: 'TRABALHO_TECNICO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), natureza: humanize(b['NATUREZA']),
              instituicao: d['INSTITUICAO-FINANCIADORA'] || '', finalidade: d['FINALIDADE'] || '',
          }) },
        { tags: ['APRESENTACAO-DE-TRABALHO'], typeKey: 'APRESENTACAO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), natureza: humanize(b['NATUREZA']),
              evento: d['NOME-DO-EVENTO'] || '', instituicao: d['INSTITUICAO-PROMOTORA'] || '',
              cidade: d['CIDADE-DA-APRESENTACAO'] || '',
          }) },
        { tags: ['CURSO-DE-CURTA-DURACAO-MINISTRADO'], typeKey: 'CURSO_MINISTRADO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b),
              instituicao: d['INSTITUICAO-PROMOTORA-DO-CURSO'] || '', cargaHoraria: d['DURACAO'] || '',
          }) },
        { tags: ['DESENVOLVIMENTO-DE-MATERIAL-DIDATICO-OU-INSTRUCIONAL'], typeKey: 'MATERIAL_DIDATICO',
          map: (el, b, d) => ({ titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el), finalidade: d['FINALIDADE'] || '' }) },
        { tags: ['ORGANIZACAO-DE-EVENTO'], typeKey: 'ORGANIZACAO_EVENTO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), tipoEvento: humanize(b['TIPO']),
              instituicao: d['INSTITUICAO-PROMOTORA'] || '', cidade: d['CIDADE'] || '',
          }) },
        { tags: ['EDITORACAO'], typeKey: 'EDITORACAO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), natureza: humanize(b['NATUREZA']),
              editora: d['EDITORA'] || '', cidade: d['CIDADE'] || '', paginas: d['NUMERO-DE-PAGINAS'] || '',
          }) },

        // ---- Prêmio ----
        { tags: ['PREMIO-TITULO'], typeKey: 'PREMIO',
          map: (el, b) => {
              const a = attrs(el);
              return { titulo: a['NOME-DO-PREMIO-OU-TITULO'] || '', ano: a['ANO-DA-PREMIACAO'] || '',
                       entidade: a['NOME-DA-ENTIDADE-PROMOTORA'] || '' };
          }, flat: true },
    ];

    /* --------------------------- parse principal ------------------------- */
    function parse(xmlText) {
        const errors = [];
        const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
        if (doc.querySelector('parsererror')) {
            return { items: [], summary: {}, errors: ['XML inválido ou corrompido.'] };
        }

        const items = [];
        const summary = {};
        const seenRefs = new Set();

        const primaryCat = (window.LattesTypes && window.LattesTypes.primaryCategory) || (() => 'PRODUCOES');

        function add(typeKey, fields, el) {
            const canon = (fields.titulo || fields.curso || fields.orientando || fields.candidato || fields.instituicao || '')
                .toLowerCase().replace(/\s+/g, ' ').trim();
            const categoryKey = primaryCat(typeKey);
            // A referência inclui a CATEGORIA: o mesmo item em categorias
            // diferentes é tratado como registros distintos (atrelados à origem).
            const ref = `${categoryKey}|${typeKey}|${canon}|${fields.ano || ''}|${fields.anoInicio || ''}|${fields.anoFim || ''}`;
            if (!canon) return;                 // ignora itens sem título
            if (seenRefs.has(ref)) return;      // dedup dentro do próprio XML (mesma categoria)
            seenRefs.add(ref);
            items.push({ typeKey, categoryKey, fields, lattesRef: ref });
            summary[typeKey] = (summary[typeKey] || 0) + 1;
        }

        // 1) Handlers baseados em DADOS-BASICOS/DETALHAMENTO
        HANDLERS.forEach(h => {
            h.tags.forEach(tag => {
                for (const el of doc.getElementsByTagName(tag)) {
                    try {
                        const b = h.flat ? attrs(el) : groupByPrefix(el, 'DADOS-BASICOS');
                        const d = h.flat ? {} : groupByPrefix(el, 'DETALHAMENTO');
                        add(h.typeKey, h.map(el, b, d), el);
                    } catch (e) { errors.push(`${tag}: ${e.message}`); }
                }
            });
        });

        // 2) Orientações (concluídas + em andamento)
        Object.keys(ORIENT_MAP).forEach(tag => {
            const ctx = ORIENT_MAP[tag];
            for (const el of doc.getElementsByTagName(tag)) {
                const b = groupByPrefix(el, 'DADOS-BASICOS');
                const d = groupByPrefix(el, 'DETALHAMENTO');
                const tkey = ctx.situacao === 'Concluída' ? 'ORIENTACAO_CONCLUIDA' : 'ORIENTACAO_ANDAMENTO';
                add(tkey, {
                    orientando: d['NOME-DO-ORIENTADO'] || d['NOME-DO-ORIENTANDO'] || '',
                    tipo: ctx.tipo,
                    titulo: pick(b, 'TITULO-DO-TRABALHO', 'TITULO'),
                    instituicao: d['NOME-DA-INSTITUICAO'] || d['NOME-INSTITUICAO'] || '',
                    ano: yearOf(b),
                }, el);
            }
        });

        // 3) Participação em eventos/congressos
        Object.keys(PARTIC_MAP).forEach(tag => {
            for (const el of doc.getElementsByTagName(tag)) {
                const b = groupByPrefix(el, 'DADOS-BASICOS');
                const d = groupByPrefix(el, 'DETALHAMENTO');
                add('PARTICIPACAO_EVENTO', {
                    titulo: pick(b, 'TITULO', ...TITLE_KEYS) || d['NOME-DO-EVENTO'] || '',
                    ano: yearOf(b), natureza: 'Participação', tipoEvento: PARTIC_MAP[tag],
                    cidade: d['CIDADE-DO-EVENTO'] || '',
                }, el);
            }
        });

        // 4) Bancas (trabalhos de conclusão + julgadoras)
        Object.keys(BANCA_MAP).forEach(tag => {
            for (const el of doc.getElementsByTagName(tag)) {
                const b = groupByPrefix(el, 'DADOS-BASICOS');
                const d = groupByPrefix(el, 'DETALHAMENTO');
                const julgadora = tag.indexOf('BANCA-JULGADORA') === 0 || tag === 'OUTRAS-BANCAS-JULGADORAS';
                add(julgadora ? 'BANCA_JULGADORA' : 'BANCA_CONCLUSAO', {
                    tipo: BANCA_MAP[tag],
                    candidato: d['NOME-DO-CANDIDATO'] || '',
                    titulo: pick(b, 'TITULO', ...TITLE_KEYS),
                    instituicao: d['NOME-INSTITUICAO'] || '',
                    ano: yearOf(b),
                }, el);
            }
        });

        // 5) Formação acadêmica / titulação (atributos no próprio elemento do nível)
        const formCont = doc.getElementsByTagName('FORMACAO-ACADEMICA-TITULACAO')[0];
        if (formCont) {
            for (const el of formCont.children) {
                const nivel = FORMACAO_MAP[el.tagName];
                if (!nivel) continue;
                const a = attrs(el);
                const tituloTrab = pick(a, 'TITULO-DO-TRABALHO-DE-CONCLUSAO-DE-CURSO', 'TITULO-DA-MONOGRAFIA',
                    'TITULO-DA-DISSERTACAO-TESE', 'TITULO-DA-RESIDENCIA-MEDICA', 'TITULO-DO-TRABALHO');
                const orientador = pick(a, 'NOME-DO-ORIENTADOR', 'NOME-COMPLETO-DO-ORIENTADOR', 'NOME-ORIENTADOR-GRAD');
                const anoInicio = a['ANO-DE-INICIO'] || '';
                const anoFim = a['ANO-DE-CONCLUSAO'] || a['ANO-DE-OBTENCAO-DO-TITULO'] || '';
                if (nivel === 'Pós-Doutorado' || nivel === 'Livre-docência') {
                    add('POS_DOUTORADO', { tipo: nivel, instituicao: a['NOME-INSTITUICAO'] || '', anoInicio, anoFim, titulo: tituloTrab, orientador }, el);
                } else {
                    add('FORMACAO_ACADEMICA', {
                        nivel, curso: a['NOME-CURSO'] || a['NOME-DO-CURSO'] || '',
                        instituicao: a['NOME-INSTITUICAO'] || '', anoInicio, anoFim, titulo: tituloTrab, orientador,
                    }, el);
                }
            }
        }

        // 5b) Formação complementar (cursos de curta duração, extensão, etc.)
        const formCompl = doc.getElementsByTagName('FORMACAO-COMPLEMENTAR')[0];
        if (formCompl) {
            // Aceita qualquer filho com nome de curso (FORMACAO-COMPLEMENTAR-* e também OUTROS)
            for (const el of formCompl.children) {
                const a = attrs(el);
                const nome = a['NOME-CURSO'] || a['NOME-DO-CURSO'];
                if (!nome) continue;
                add('FORMACAO_COMPLEMENTAR', {
                    titulo: nome,
                    ano: a['ANO-DE-CONCLUSAO'] || a['ANO-DE-INICIO'] || '',
                    instituicao: a['NOME-INSTITUICAO'] || '',
                    cargaHoraria: a['CARGA-HORARIA'] || '',
                }, el);
            }
        }

        // 6) Atuação profissional → vínculos
        for (const atu of doc.getElementsByTagName('ATUACAO-PROFISSIONAL')) {
            const nomeInst = attrs(atu)['NOME-INSTITUICAO'] || '';
            for (const v of atu.children) {
                if (v.tagName !== 'VINCULOS') continue;
                const a = attrs(v);
                // Quando TIPO/ENQUADRAMENTO é "LIVRE" (ou vazio), o valor real do
                // vínculo/cargo está nos campos OUTRO-*-INFORMADO.
                const enumOuVazio = (val) => (val && val !== 'LIVRE') ? humanize(val) : '';
                add('VINCULO_PROFISSIONAL', {
                    instituicao: nomeInst,
                    vinculo: a['OUTRO-VINCULO-INFORMADO'] || enumOuVazio(a['TIPO-DE-VINCULO']),
                    cargo: a['OUTRO-ENQUADRAMENTO-FUNCIONAL-INFORMADO'] || enumOuVazio(a['ENQUADRAMENTO-FUNCIONAL']),
                    anoInicio: a['ANO-INICIO'] || '',
                    anoFim: a['ANO-FIM'] || '',
                    titulo: a['OUTRAS-INFORMACOES'] || '',
                }, v);
            }
        }

        // 6b) Atuação profissional → atividades (ensino, direção, conselho, extensão, serviço, outras)
        const ATIV = [
            { tag: 'ENSINO', typeKey: 'ATIV_ENSINO', map: (a, el) => ({
                titulo: a['NOME-CURSO'] || humanize(a['TIPO-ENSINO']) || 'Ensino',
                anoInicio: a['ANO-INICIO'] || '', anoFim: a['ANO-FIM'] || '',
                disciplinas: Array.from(el.getElementsByTagName('DISCIPLINA')).map(d => (d.textContent || '').trim()).filter(Boolean).join('; '),
            }) },
            { tag: 'DIRECAO-E-ADMINISTRACAO', typeKey: 'ATIV_DIRECAO', map: (a) => ({
                titulo: a['CARGO-OU-FUNCAO'] || 'Direção/administração', orgao: a['NOME-ORGAO'] || '',
                anoInicio: a['ANO-INICIO'] || '', anoFim: a['ANO-FIM'] || '' }) },
            { tag: 'CONSELHO-COMISSAO-E-CONSULTORIA', typeKey: 'ATIV_CONSELHO', map: (a) => ({
                titulo: a['NOME-ORGAO'] || 'Conselho/comissão', papel: a['ESPECIFICACAO'] || '',
                anoInicio: a['ANO-INICIO'] || '', anoFim: a['ANO-FIM'] || '' }) },
            { tag: 'EXTENSAO-UNIVERSITARIA', typeKey: 'ATIV_EXTENSAO', map: (a) => ({
                titulo: a['ATIVIDADE-DE-EXTENSAO-REALIZADA'] || 'Extensão universitária', orgao: a['NOME-ORGAO'] || '',
                anoInicio: a['ANO-INICIO'] || '', anoFim: a['ANO-FIM'] || '' }) },
            { tag: 'SERVICO-TECNICO-ESPECIALIZADO', typeKey: 'ATIV_SERVICO', map: (a) => ({
                titulo: a['SERVICO-REALIZADO'] || 'Serviço técnico', orgao: a['NOME-ORGAO'] || '',
                anoInicio: a['ANO-INICIO'] || '', anoFim: a['ANO-FIM'] || '' }) },
            { tag: 'OUTRA-ATIVIDADE-TECNICO-CIENTIFICA', typeKey: 'ATIV_OUTRA', map: (a) => ({
                titulo: a['ATIVIDADE-REALIZADA'] || 'Atividade técnico-científica', orgao: a['NOME-ORGAO'] || '',
                anoInicio: a['ANO-INICIO'] || '', anoFim: a['ANO-FIM'] || '' }) },
        ];
        try {
        for (const atu of doc.getElementsByTagName('ATUACAO-PROFISSIONAL')) {
            const nomeInst = attrs(atu)['NOME-INSTITUICAO'] || '';
            ATIV.forEach(h => {
                for (const el of atu.getElementsByTagName(h.tag)) {
                    const f = h.map(attrs(el), el);
                    f.instituicao = nomeInst;
                    add(h.typeKey, f, el);
                }
            });
        }
        } catch (e) { errors.push('Atividades da atuação: ' + e.message); }

        // 7) Dados gerais: identificação, endereço, idiomas, áreas de atuação,
        //    resumo do CV e outras informações relevantes.
        try {
        const clean = (s) => String(s || '').replace(/&#1[03];/g, m => m === '&#10;' ? '\n' : '').trim();
        const dgEl = doc.getElementsByTagName('DADOS-GERAIS')[0];
        if (dgEl) {
            const g = attrs(dgEl);
            if (g['NOME-COMPLETO']) {
                add('IDENTIFICACAO', {
                    titulo: g['NOME-COMPLETO'], citacoes: g['NOME-EM-CITACOES-BIBLIOGRAFICAS'] || '',
                    orcid: g['ORCID-ID'] || '',
                }, dgEl);
            }
            const resumo = firstTag(dgEl, 'RESUMO-CV');
            if (resumo) {
                const t = attrs(resumo)['TEXTO-RESUMO-CV-RH'] || '';
                if (t) add('RESUMO_CV', { titulo: 'Texto inicial do Currículo Lattes', descricao: clean(t) }, resumo);
            }
            const outras = firstTag(dgEl, 'OUTRAS-INFORMACOES-RELEVANTES');
            if (outras) {
                const t = attrs(outras)['OUTRAS-INFORMACOES-RELEVANTES'] || '';
                if (t) add('OUTRAS_INFO', { titulo: 'Outras informações relevantes', descricao: clean(t) }, outras);
            }
            const endProf = firstTag(dgEl, 'ENDERECO-PROFISSIONAL');
            if (endProf) {
                const e = attrs(endProf);
                const log = e['LOGRADOURO-COMPLEMENTO'] || e['NOME-INSTITUICAO-EMPRESA'] || '';
                if (log) add('ENDERECO', { titulo: log, tipo: 'Profissional', cidade: e['CIDADE'] || '', uf: e['UF'] || '', cep: e['CEP'] || '' }, endProf);
            }
        }
        // Idiomas
        for (const el of doc.getElementsByTagName('IDIOMA')) {
            const a = attrs(el);
            const hab = [
                ['Leitura', a['PROFICIENCIA-DE-LEITURA']], ['Fala', a['PROFICIENCIA-DE-FALA']],
                ['Escrita', a['PROFICIENCIA-DE-ESCRITA']], ['Compreensão', a['PROFICIENCIA-DE-COMPREENSAO']],
            ].filter(([, v]) => v && PROF_MAP[v]).map(([k, v]) => `${k}: ${PROF_MAP[v]}`).join('; ');
            add('IDIOMAS', { titulo: a['DESCRICAO-DO-IDIOMA'] || a['IDIOMA'] || '', habilidades: hab }, el);
        }
        // Áreas de atuação (categoria 03)
        for (const el of doc.getElementsByTagName('AREA-DE-ATUACAO')) {
            const a = attrs(el);
            const titulo = a['NOME-DA-ESPECIALIDADE'] || a['NOME-DA-SUB-AREA-DO-CONHECIMENTO'] || a['NOME-DA-AREA-DO-CONHECIMENTO'] || humanize(a['NOME-GRANDE-AREA-DO-CONHECIMENTO']);
            if (!titulo) continue;
            add('AREA_ATUACAO', {
                titulo, grandeArea: humanize(a['NOME-GRANDE-AREA-DO-CONHECIMENTO']),
                subarea: a['NOME-DA-SUB-AREA-DO-CONHECIMENTO'] || '', especialidade: a['NOME-DA-ESPECIALIDADE'] || '',
            }, el);
        }
        } catch (e) { errors.push('Dados gerais: ' + e.message); }

        // Titular
        const dg = doc.getElementsByTagName('DADOS-GERAIS')[0];
        const titular = dg ? (attrs(dg)['NOME-COMPLETO'] || '') : '';

        return { items, summary, errors, titular };
    }

    return { parse };
})();

</script>
<script>
/* ===== js/app.js ===== */
/* ==========================================================================
   lattesZen — Orquestrador principal (SPA)
   ========================================================================== */
(function () {
    'use strict';

    /* ----------------------------- Estado ------------------------------- */
    const state = {
        items: [],          // catálogo
        editingId: null,    // item em edição
        pendingPdf: null,   // File aguardando gravação
        lattesParsed: null, // resultado do parse do XML
        currentPdfUrl: null,// URL (blob) do PDF exibido no painel lateral
        sortOrder: 'desc',  // ordenação por ano no Catálogo
        vocab: {},          // listas curadas de autocomplete (por chave de campo)
    };

    /* --------------------------- Utilidades ----------------------------- */
    const $ = (sel, ctx = document) => ctx.querySelector(sel);
    const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function uid() {
        if (crypto && crypto.randomUUID) return 'lz-' + crypto.randomUUID().slice(0, 8);
        return 'lz-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    }
    function nowISO() { return new Date().toISOString(); }

    // Extensão do anexo a partir do tipo MIME / nome do arquivo
    function fileExt(file) {
        const t = (file.type || '').toLowerCase();
        if (t === 'application/pdf') return 'pdf';
        if (t === 'image/png') return 'png';
        if (t === 'image/jpeg') return 'jpg';
        const m = (file.name || '').match(/\.(\w+)$/);
        return m ? m[1].toLowerCase() : 'pdf';
    }
    function isImageExt(ext) { return /^(jpe?g|png|gif|webp)$/i.test(ext || ''); }

    function toast(msg, type = 'info') {
        const colors = {
            info: 'bg-govbr-600 dark:bg-unifesp-700',
            ok: 'bg-green-600', erro: 'bg-red-600', aviso: 'bg-amber-600',
        };
        const el = document.createElement('div');
        el.className = `${colors[type] || colors.info} text-white text-sm px-4 py-2 rounded shadow-lg max-w-xs`;
        el.textContent = msg;
        $('#toasts').appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .4s'; }, 3200);
        setTimeout(() => el.remove(), 3700);
    }

    /* --------------------------- Persistência --------------------------- */
    function saveCatalog() { Storage.saveCatalog(state.items); }
    function saveVocab() {
        const s = Storage.loadSettings();
        s.vocab = state.vocab;
        Storage.saveSettings(s);
    }

    async function persistItem(item, pdfFile) {
        // grava em memória + localStorage
        const idx = state.items.findIndex(i => i.id === item.id);
        if (idx >= 0) state.items[idx] = item; else state.items.push(item);
        saveCatalog();

        // grava arquivos no subdiretório da categoria, se um diretório está configurado
        if (Storage.hasDirectory()) {
            const subdir = LattesTypes.categoryFolder(item.categoryKey);
            try {
                await Storage.writeJson(item.id, item, subdir);
                if (pdfFile) {
                    const ext = fileExt(pdfFile);
                    await Storage.writeAttachment(item.id, pdfFile, subdir, ext);
                    item.hasPdf = true;
                    item.pdfName = pdfFile.name;
                    item.fileExt = ext;
                    saveCatalog();
                    await Storage.writeJson(item.id, item, subdir); // regrava com hasPdf/fileExt
                }
            } catch (e) {
                toast('Item salvo no índice, mas falhou ao gravar arquivos: ' + e.message, 'aviso');
                return;
            }
        } else if (pdfFile) {
            toast('Arquivo não gravado: configure um diretório em Configurações.', 'aviso');
        }
    }

    async function deleteItem(id) {
        const item = state.items.find(i => i.id === id);
        state.items = state.items.filter(i => i.id !== id);
        saveCatalog();
        try { await Storage.deleteFiles(id, item ? LattesTypes.categoryFolder(item.categoryKey) : null); } catch (_) {}
    }

    /* =====================================================================
       ABA: CATALOGAR
       ===================================================================== */
    function renderCatalogar() {
        const panel = $('#tab-catalogar');
        panel.innerHTML = `
            <div class="grid lg:grid-cols-5 gap-6 items-start">
                <section class="lg:col-span-2 bg-gray-50 dark:bg-gray-800 rounded-lg border border-gray-200 dark:border-gray-700 p-4">
                    <h2 class="text-lg font-bold mb-3 flex items-center gap-2">
                        <i aria-hidden="true" class="fa-solid fa-file-circle-plus text-govbr-600 dark:text-unifesp-400"></i>
                        <span id="formTitulo">Novo item</span>
                    </h2>
                    <form id="itemForm" class="space-y-3"></form>
                </section>
                <section class="lg:col-span-3 lg:sticky lg:top-4">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="text-lg font-bold flex items-center gap-2">
                            <i aria-hidden="true" class="fa-solid fa-file-lines text-red-600"></i>
                            Visualização do arquivo
                        </h2>
                        <div class="flex gap-1">
                            <button type="button" id="pdfNewTab" title="Abrir em nova aba" class="w-8 h-8 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 hidden"><i class="fa-solid fa-up-right-from-square"></i></button>
                            <button type="button" id="pdfClose" title="Fechar" class="w-8 h-8 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-gray-500 hidden"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                    <div class="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden bg-gray-100 dark:bg-gray-900 flex items-center justify-center" style="height: 85vh; min-height: 560px">
                        <div id="pdfEmpty" class="h-full flex flex-col items-center justify-center text-center text-gray-400 dark:text-gray-500 p-6">
                            <i class="fa-regular fa-file-lines text-5xl mb-3"></i>
                            <p class="text-sm">O arquivo (PDF ou imagem) aparece aqui ao anexá-lo no formulário<br>ou ao abrir um item com evidência (aba <strong>Catálogo</strong>).</p>
                        </div>
                        <iframe id="pdfFrame" class="w-full h-full hidden" title="Pré-visualização do arquivo"></iframe>
                        <img id="pdfImg" class="max-w-full max-h-full object-contain hidden" alt="Pré-visualização da imagem">
                    </div>
                    <p id="pdfPanelName" class="text-xs text-gray-500 mt-1 truncate"></p>
                </section>
            </div>`;

        buildForm();
        $('#pdfClose').addEventListener('click', clearPdf);
        $('#pdfNewTab').addEventListener('click', () => { if (state.currentPdfUrl) window.open(state.currentPdfUrl, '_blank'); });
    }

    /* =====================================================================
       ABA: CATÁLOGO (lista de itens)
       ===================================================================== */
    function renderCatalogo() {
        const panel = $('#tab-catalogo');
        panel.innerHTML = `
            <div class="flex items-center justify-between mb-3 gap-2 flex-wrap">
                <h2 class="text-lg font-bold flex items-center gap-2">
                    <i aria-hidden="true" class="fa-solid fa-list text-govbr-600 dark:text-unifesp-400"></i>
                    Itens catalogados <span id="itemCount" class="text-sm font-normal text-gray-500"></span>
                </h2>
                <div class="flex items-center gap-2 flex-wrap">
                    <label class="text-xs text-gray-500 flex items-center gap-1">
                        <i aria-hidden="true" class="fa-solid fa-arrow-down-wide-short"></i> Ordenar por ano
                        <select id="sortOrder" class="text-sm px-2 py-1.5 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900">
                            <option value="desc">Decrescente (recente → antigo)</option>
                            <option value="asc">Crescente (antigo → recente)</option>
                        </select>
                    </label>
                    <input id="filterBox" type="search" placeholder="Filtrar..."
                           class="text-sm px-3 py-1.5 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900 w-full sm:w-56">
                </div>
            </div>
            <div class="flex gap-2 mb-3">
                <button id="btnExpandAll" class="text-xs px-2 py-1 rounded border border-gray-300 dark:border-gray-600">Expandir todas</button>
                <button id="btnCollapseAll" class="text-xs px-2 py-1 rounded border border-gray-300 dark:border-gray-600">Recolher todas</button>
            </div>
            <div id="itemList" class="space-y-3"></div>`;
        $('#sortOrder').value = state.sortOrder || 'desc';
        renderItemList();
        $('#filterBox').addEventListener('input', renderItemList);
        $('#sortOrder').addEventListener('change', (e) => { state.sortOrder = e.target.value; renderItemList(); });
        $('#btnExpandAll').addEventListener('click', () => $$('#itemList details').forEach(d => d.open = true));
        $('#btnCollapseAll').addEventListener('click', () => $$('#itemList details').forEach(d => d.open = false));
    }

    /* =====================================================================
       Painel de visualização do PDF (dentro de "Catalogar")
       ===================================================================== */
    function setPdf(url, name, ext) {
        const frame = $('#pdfFrame'), img = $('#pdfImg');
        if (!frame) return; // painel não montado (outra aba ativa)
        if (state.currentPdfUrl && state.currentPdfUrl !== url) {
            try { URL.revokeObjectURL(state.currentPdfUrl); } catch (_) {}
        }
        state.currentPdfUrl = url;
        if (isImageExt(ext)) {
            img.src = url; img.classList.remove('hidden');
            frame.src = 'about:blank'; frame.classList.add('hidden');
        } else {
            frame.src = url; frame.classList.remove('hidden');
            img.removeAttribute('src'); img.classList.add('hidden');
        }
        $('#pdfEmpty').classList.add('hidden');
        $('#pdfClose').classList.remove('hidden');
        $('#pdfNewTab').classList.remove('hidden');
        $('#pdfPanelName').textContent = name || '';
    }
    function clearPdf() {
        const frame = $('#pdfFrame'), img = $('#pdfImg');
        if (state.currentPdfUrl) { try { URL.revokeObjectURL(state.currentPdfUrl); } catch (_) {} state.currentPdfUrl = null; }
        if (!frame) return;
        frame.src = 'about:blank'; frame.classList.add('hidden');
        if (img) { img.removeAttribute('src'); img.classList.add('hidden'); }
        $('#pdfEmpty').classList.remove('hidden');
        $('#pdfClose').classList.add('hidden');
        $('#pdfNewTab').classList.add('hidden');
        $('#pdfPanelName').textContent = '';
    }
    function previewPdfFile(file) {
        if (!file) return;
        setPdf(URL.createObjectURL(file), file.name, fileExt(file));
    }
    async function showPdfForItem(item) {
        if (!$('#pdfFrame')) return;
        if (!item.hasPdf) { clearPdf(); return; }
        try {
            const ext = item.fileExt || 'pdf';
            const url = await Storage.readAttachmentUrl(item.id, LattesTypes.categoryFolder(item.categoryKey), ext);
            if (url) setPdf(url, item.pdfName || `${item.id}.${ext}`, ext);
            else { clearPdf(); toast('Arquivo não encontrado no diretório (sincronize a pasta).', 'aviso'); }
        } catch (e) { clearPdf(); }
    }

    function buildForm(item) {
        const form = $('#itemForm');
        const editing = !!item;
        $('#formTitulo').textContent = editing ? 'Editar item' : 'Novo item';

        let currentType = item ? LattesTypes.normalizeType(item.typeKey) : '';
        let currentCat = item ? (item.categoryKey || LattesTypes.primaryCategory(currentType)) : '';
        if (currentCat === 'NAO_LATTES') currentCat = 'ATIVIDADES_LIVRES'; // legado

        form.innerHTML = `
            <div id="evidenceBlock" class="bg-govbr-50 dark:bg-gray-900 border border-govbr-100 dark:border-gray-700 rounded px-3 py-2">
                <label class="block text-xs font-semibold mb-1"><i aria-hidden="true" class="fa-solid fa-file-arrow-up text-govbr-600 dark:text-unifesp-400 mr-1"></i> <span id="pdfInputLabel">Evidência (PDF ou imagem)</span></label>
                <input type="file" id="pdfInput" accept="application/pdf,image/jpeg,image/png"
                       class="w-full text-sm text-gray-600 dark:text-gray-300 file:mr-2 file:px-3 file:py-1.5 file:rounded file:border-0 file:bg-govbr-600 dark:file:bg-unifesp-700 file:text-white">
                <p id="pdfStatus" class="text-xs text-gray-500 mt-1"></p>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold mb-1">Categoria</label>
                    <select id="selCategoria" class="w-full text-sm px-2 py-1.5 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold mb-1">Tipo do item</label>
                    <select id="selTipo" class="w-full text-sm px-2 py-1.5 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900"></select>
                </div>
            </div>

            <div id="dynFields" class="space-y-3"></div>

            <label id="inLattesWrap" class="flex items-center gap-2 text-sm">
                <input type="checkbox" id="chkInLattes" ${item ? (item.inLattes ? 'checked' : '') : ''}>
                <span>Este item <strong>já consta no Currículo Lattes</strong></span>
            </label>

            <div class="flex gap-2 pt-2">
                <button type="submit" class="px-4 py-2 rounded bg-govbr-600 dark:bg-unifesp-700 text-white text-sm font-semibold hover:opacity-90">
                    <i aria-hidden="true" class="fa-solid fa-floppy-disk mr-1"></i> ${editing ? 'Salvar alterações' : 'Adicionar item'}
                </button>
                <button type="button" id="btnCancelar" class="px-4 py-2 rounded border border-gray-300 dark:border-gray-600 text-sm ${editing ? '' : 'hidden'}">Cancelar</button>
            </div>
            ${datalistsHtml()}`;

        // Preencher selects de categoria/tipo
        const selCat = $('#selCategoria');
        selCat.innerHTML = LattesTypes.categories.map(c => `<option value="${c.key}">${esc(c.num + '. ' + c.label)}</option>`).join('');
        if (currentCat) selCat.value = currentCat;

        const optFor = (tk) => `<option value="${tk}">${esc(LattesTypes.label(tk))}</option>`;
        function fillTipos() {
            const cat = LattesTypes.categories.find(c => c.key === selCat.value);
            let html;
            if (cat.groups) {
                html = cat.groups.map(g =>
                    `<optgroup label="${esc(g.label)}">${g.types.map(optFor).join('')}</optgroup>`).join('');
            } else {
                html = cat.types.map(optFor).join('');
            }
            $('#selTipo').innerHTML = html;
            const allTypes = cat.groups ? cat.groups.flatMap(g => g.types) : cat.types;
            if (currentType && allTypes.includes(currentType)) $('#selTipo').value = currentType;
            // "Já consta no Lattes" não se aplica a Atividades livres (categoria 99)
            $('#inLattesWrap').style.display = LattesTypes.isNaoLattesCategory(selCat.value) ? 'none' : '';
            renderDynFields();
        }
        function renderDynFields() {
            const def = LattesTypes.get($('#selTipo').value);
            const vals = item ? (item.fields || {}) : {};
            $('#dynFields').innerHTML = (def ? def.fields : []).map(f => fieldHtml(f, vals[f.key])).join('');
            // Alguns tipos não têm comprovação (ex.: Conexões — apenas o link)
            const semEvidencia = !!(def && def.noEvidence);
            $('#evidenceBlock').style.display = semEvidencia ? 'none' : '';
            if (semEvidencia) { state.pendingPdf = null; clearPdf(); }
            // Tipos de arquivo aceitos e rótulo conforme o tipo do item
            const accept = (def && def.accept) || 'application/pdf,image/jpeg,image/png';
            const inp = $('#pdfInput'); if (inp) inp.accept = accept;
            const lbl = $('#pdfInputLabel');
            if (lbl) lbl.textContent = accept === 'image/jpeg,image/png' ? 'Foto (JPEG ou PNG)'
                : (def && def.key === 'DOCUMENTO_PESSOAL' ? 'Documento (PDF ou imagem)' : 'Evidência (PDF ou imagem)');
        }

        selCat.addEventListener('change', () => { currentType = ''; fillTipos(); });
        $('#selTipo').addEventListener('change', renderDynFields);
        fillTipos();

        // PDF
        const pdfStatus = $('#pdfStatus');
        if (item && item.hasPdf) pdfStatus.textContent = `PDF atual: ${item.pdfName || item.id + '.pdf'}`;
        $('#pdfInput').addEventListener('change', (e) => {
            state.pendingPdf = e.target.files[0] || null;
            pdfStatus.textContent = state.pendingPdf ? `Selecionado: ${state.pendingPdf.name}` : '';
            if (state.pendingPdf) previewPdfFile(state.pendingPdf); // exibe no painel lateral
        });

        // Submit
        form.addEventListener('submit', onSubmitForm);
        $('#btnCancelar').addEventListener('click', () => { state.editingId = null; state.pendingPdf = null; buildForm(); });

        state.editingId = editing ? item.id : null;

        // Painel lateral do PDF: mostra evidência do item em edição, ou limpa
        if (editing && item.hasPdf) showPdfForItem(item);
        else clearPdf();
    }

    // Opções de ano para os seletores (decrescente). Inclui uma folga futura
    // (conclusões previstas) e garante que o valor já salvo apareça, mesmo
    // fora da faixa padrão.
    function yearOptions(val) {
        const atual = new Date().getFullYear();
        const inicio = atual + 5, fim = 1940;
        const anos = [];
        for (let y = inicio; y >= fim; y--) anos.push(y);
        const v = String(val || '').trim();
        if (v && !anos.includes(Number(v)) && /^\d{3,4}$/.test(v)) anos.unshift(Number(v));
        return anos.map(y => `<option value="${y}" ${String(y) === v ? 'selected' : ''}>${y}</option>`).join('');
    }

    // Campos que ganham autocomplete (combobox): escolha da lista OU digitação
    // de um valor novo. Sugestões = lista curada (editável em Configurações) +
    // valores já usados no catálogo.
    const AUTOCOMPLETE_KEYS = ['instituicao', 'financiador', 'entidade', 'orgao', 'editora', 'periodico', 'evento'];
    const VOCAB_LABELS = {
        instituicao: 'Instituições', financiador: 'Financiadores / Agências', entidade: 'Entidades',
        orgao: 'Órgãos', editora: 'Editoras', periodico: 'Periódicos / Revistas', evento: 'Eventos',
    };
    function collectSuggestions(key) {
        const set = new Set(state.vocab[key] || []);
        state.items.forEach(i => { const v = i.fields && i.fields[key]; if (v && String(v).trim()) set.add(String(v).trim()); });
        return Array.from(set).filter(Boolean).sort((a, b) => a.localeCompare(b, 'pt-BR'));
    }
    function datalistsHtml() {
        return AUTOCOMPLETE_KEYS.map(k =>
            `<datalist id="dl-${k}">${collectSuggestions(k).map(v => `<option value="${esc(v)}"></option>`).join('')}</datalist>`
        ).join('');
    }

    function fieldHtml(f, val) {
        val = val == null ? '' : val;
        const req = f.required ? 'required' : '';
        const reqMark = f.required ? ' <span class="text-red-500">*</span>' : '';
        const base = 'w-full text-sm px-2 py-1.5 rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-900';
        let input;
        if (f.type === 'textarea') {
            input = `<textarea name="${f.key}" ${req} rows="2" placeholder="${esc(f.placeholder || '')}" class="${base}">${esc(val)}</textarea>`;
        } else if (f.type === 'select') {
            input = `<select name="${f.key}" ${req} class="${base}">
                <option value="">—</option>
                ${f.options.map(o => `<option value="${esc(o)}" ${o === val ? 'selected' : ''}>${esc(o)}</option>`).join('')}
            </select>`;
        } else if (f.type === 'year') {
            // Campo de ano "fechado": seletor de anos, evita digitação incorreta
            input = `<select name="${f.key}" ${req} class="${base}">
                <option value="">—</option>
                ${yearOptions(val)}
            </select>`;
        } else if (f.type === 'checkboxes') {
            const selected = String(val || '').split(/[;,]/).map(s => s.trim()).filter(Boolean);
            input = `<div class="flex flex-wrap gap-x-4 gap-y-1 pt-1">
                ${f.options.map(o => `<label class="flex items-center gap-1.5 text-sm">
                    <input type="checkbox" data-cbgroup="${f.key}" value="${esc(o)}" ${selected.includes(o) ? 'checked' : ''}> ${esc(o)}
                </label>`).join('')}
            </div>`;
        } else if (f.type === 'skilllevels') {
            const levels = f.levels || ['Bom', 'Razoável', 'Pouco'];
            const map = {};
            String(val || '').split(';').forEach(pair => {
                const idx = pair.indexOf(':');
                if (idx > -1) { const s = pair.slice(0, idx).trim(), l = pair.slice(idx + 1).trim(); if (s && l) map[s] = l; }
            });
            input = `<div class="space-y-1 pt-1">
                ${f.options.map(sk => `<div class="flex items-center gap-2 text-sm">
                    <span class="w-32 shrink-0">${esc(sk)}</span>
                    <select data-slgroup="${f.key}" data-skill="${esc(sk)}" class="${base}">
                        <option value="">—</option>
                        ${levels.map(l => `<option value="${esc(l)}" ${map[sk] === l ? 'selected' : ''}>${esc(l)}</option>`).join('')}
                    </select>
                </div>`).join('')}
            </div>`;
        } else {
            const t = (f.type === 'url' ? 'url' : (f.type === 'number' ? 'number' : (f.type === 'date' ? 'date' : 'text')));
            const listAttr = (t === 'text' && AUTOCOMPLETE_KEYS.includes(f.key)) ? `list="dl-${f.key}"` : '';
            input = `<input type="${t}" name="${f.key}" value="${esc(val)}" ${req} ${listAttr} placeholder="${esc(f.placeholder || '')}" class="${base}">`;
        }
        return `<div>
            <label class="block text-xs font-semibold mb-1">${esc(f.label)}${reqMark}</label>
            ${input}
            ${f.help ? `<p class="text-xs text-gray-500 mt-0.5">${esc(f.help)}</p>` : ''}
        </div>`;
    }

    async function onSubmitForm(e) {
        e.preventDefault();
        const form = e.target;
        const categoryKey = $('#selCategoria').value;
        const typeKey = $('#selTipo').value;
        const naoLattes = LattesTypes.isNaoLattesCategory(categoryKey);
        const def = LattesTypes.get(typeKey);

        const fields = {};
        def.fields.forEach(f => {
            if (f.type === 'checkboxes') {
                fields[f.key] = $$(`[data-cbgroup="${f.key}"]`, form).filter(c => c.checked).map(c => c.value).join('; ');
            } else if (f.type === 'skilllevels') {
                fields[f.key] = $$(`[data-slgroup="${f.key}"]`, form).filter(s => s.value).map(s => `${s.dataset.skill}: ${s.value}`).join('; ');
            } else {
                const el = form.elements[f.key];
                if (el) fields[f.key] = el.value.trim();
            }
        });

        // validação simples
        const faltando = def.fields.filter(f => f.required && !fields[f.key]);
        if (faltando.length) { toast('Preencha: ' + faltando.map(f => f.label).join(', '), 'aviso'); return; }

        const editing = state.editingId ? state.items.find(i => i.id === state.editingId) : null;
        const item = editing || {
            id: uid(), createdAt: nowISO(),
            source: 'local', hasPdf: false, pdfName: null, lattesRef: null,
        };
        item.lattesItem = !naoLattes;
        item.typeKey = typeKey;
        item.categoryKey = categoryKey;
        item.fields = fields;
        const inLattesEl = $('#chkInLattes');
        item.inLattes = naoLattes ? false : (inLattesEl ? inLattesEl.checked : false);
        item.updatedAt = nowISO();

        await persistItem(item, state.pendingPdf);
        toast(editing ? 'Item atualizado.' : 'Item adicionado.', 'ok');

        state.editingId = null; state.pendingPdf = null;
        buildForm();
        renderItemList();
    }

    function statusBadges(item) {
        const b = [];
        if (item.lattesItem) {
            b.push(item.inLattes
                ? '<span class="badge bg-blue-100 text-blue-800 dark:bg-blue-900/40 dark:text-blue-300"><i class="fa-solid fa-check"></i> No Lattes</span>'
                : '<span class="badge bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-300"><i class="fa-solid fa-triangle-exclamation"></i> Falta no Lattes</span>');
        } else {
            b.push('<span class="badge bg-purple-100 text-purple-800 dark:bg-purple-900/40 dark:text-purple-300"><i class="fa-solid fa-heart"></i> Não-Lattes</span>');
        }
        b.push(item.hasPdf
            ? '<span class="badge bg-green-100 text-green-800 dark:bg-green-900/40 dark:text-green-300"><i class="fa-solid fa-file-pdf"></i> Comprovado</span>'
            : '<span class="badge bg-gray-200 text-gray-600 dark:bg-gray-700 dark:text-gray-300"><i class="fa-solid fa-file-circle-xmark"></i> Sem PDF</span>');
        return b.join(' ');
    }

    function itemYear(i) {
        const y = (i.fields && (i.fields.ano || i.fields.anoFim || i.fields.anoInicio)) || '';
        const n = parseInt(String(y).replace(/\D/g, '').slice(0, 4), 10);
        return isNaN(n) ? null : n;
    }

    function itemCardHtml(i) {
        return `
            <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded p-3">
                <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                        <p class="font-semibold text-sm truncate">${esc(LattesTypes.itemTitle(i))}</p>
                        <p class="text-xs text-gray-500">${esc(LattesTypes.label(i.typeKey))} ${i.fields.ano ? '· ' + esc(i.fields.ano) : ''}</p>
                        <div class="mt-1.5 flex flex-wrap gap-1">${statusBadges(i)}</div>
                    </div>
                    <div class="flex gap-1 shrink-0">
                        ${i.hasPdf ? `<button data-act="pdf" data-id="${i.id}" title="Ver arquivo no painel (Catalogar)" class="w-8 h-8 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-red-600"><i class="fa-solid ${isImageExt(i.fileExt) ? 'fa-image' : 'fa-file-pdf'}"></i></button>` : ''}
                        <button data-act="edit" data-id="${i.id}" title="Abrir / Editar" class="w-8 h-8 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-govbr-600 dark:text-unifesp-400"><i class="fa-solid fa-pen"></i></button>
                        <button data-act="del" data-id="${i.id}" title="Excluir" class="w-8 h-8 rounded hover:bg-gray-100 dark:hover:bg-gray-700 text-red-600"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </div>`;
    }

    function sortByYear(items, asc) {
        return items.slice().sort((a, b) => {
            const ya = itemYear(a), yb = itemYear(b);
            if (ya !== yb) {
                if (ya == null) return 1;              // sem ano vai para o fim
                if (yb == null) return -1;
                return asc ? ya - yb : yb - ya;
            }
            return (b.updatedAt || '').localeCompare(a.updatedAt || '');
        });
    }

    // Monta o HTML segmentado em 2 níveis: categoria (01..11, 99) → tipo de item.
    // Só categorias/tipos com itens são exibidos. Reutilizado em Catálogo e Relatório.
    function buildGroupedHtml(items) {
        const order = LattesTypes.categories.map(c => c.key).concat('NAO_LATTES');
        const groups = {};
        items.forEach(i => { (groups[i.categoryKey] = groups[i.categoryKey] || []).push(i); });
        const typeOrderOf = (catKey) => {
            const c = LattesTypes.categoryByKey(catKey);
            if (!c) return [];
            return c.groups ? c.groups.flatMap(g => g.types) : (c.types || []);
        };
        return order.filter(k => groups[k] && groups[k].length).map(k => {
            const g = groups[k];
            const byType = {};
            g.forEach(i => { (byType[i.typeKey] = byType[i.typeKey] || []).push(i); });
            const seq = typeOrderOf(k);
            const typeKeys = Object.keys(byType).sort((a, b) => {
                const ia = seq.indexOf(a), ib = seq.indexOf(b);
                return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
            });
            const typesHtml = typeKeys.map(tk => `
                <details open class="border border-gray-100 dark:border-gray-700/60 rounded">
                    <summary class="cursor-pointer select-none px-2 py-1.5 bg-gray-50 dark:bg-gray-800/60 text-sm font-medium text-gray-700 dark:text-gray-300 flex items-center gap-2">
                        <i aria-hidden="true" class="fa-solid fa-angle-right text-xs text-gray-400"></i>
                        ${esc(LattesTypes.label(tk))}
                        <span class="text-xs font-normal text-gray-500">(${byType[tk].length})</span>
                    </summary>
                    <div class="p-2 space-y-2">${byType[tk].map(itemCardHtml).join('')}</div>
                </details>`).join('');
            return `
            <details open class="border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
                <summary class="cursor-pointer select-none px-3 py-2 bg-gray-100 dark:bg-gray-800 font-semibold text-sm flex items-center gap-2">
                    <i aria-hidden="true" class="fa-solid ${esc((LattesTypes.categoryByKey(k) || {}).icon || 'fa-folder')} text-govbr-600 dark:text-unifesp-400"></i>
                    ${esc(LattesTypes.categoryNumLabel(k))}
                    <span class="text-xs font-normal text-gray-500">(${g.length})</span>
                </summary>
                <div class="p-2 space-y-2">${typesHtml}</div>
            </details>`;
        }).join('');
    }
    function bindItemActions(container) {
        $$('[data-act]', container).forEach(btn => btn.addEventListener('click', onItemAction));
    }

    function renderItemList() {
        const list = $('#itemList');
        if (!list) return; // aba Catálogo não está montada
        const q = ($('#filterBox') && $('#filterBox').value || '').toLowerCase();
        const asc = (state.sortOrder || 'desc') === 'asc';
        $('#itemCount').textContent = `(${state.items.length})`;

        let items = state.items.slice();
        if (q) items = items.filter(i => (LattesTypes.itemTitle(i) + ' ' + LattesTypes.label(i.typeKey) + ' ' + LattesTypes.categoryLabel(i.categoryKey)).toLowerCase().includes(q));

        if (!items.length) {
            list.innerHTML = `<p class="text-sm text-gray-500 italic py-6 text-center">${state.items.length ? 'Nenhum item corresponde ao filtro.' : 'Nenhum item ainda. Adicione pelo formulário ou importe o XML do Lattes.'}</p>`;
            return;
        }
        list.innerHTML = buildGroupedHtml(sortByYear(items, asc));
        bindItemActions(list);
    }

    async function onItemAction(e) {
        const btn = e.currentTarget;
        const id = btn.dataset.id;
        const item = state.items.find(i => i.id === id);
        if (!item) return;
        if (btn.dataset.act === 'edit' || btn.dataset.act === 'pdf') {
            // Abre o item na aba Catalogar; o PDF (se houver) aparece no painel lateral
            state.pendingPdf = null;
            switchTab('catalogar');
            buildForm(item);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else if (btn.dataset.act === 'del') {
            if (!confirm(`Excluir "${LattesTypes.itemTitle(item)}"? Os arquivos ${id}.pdf/.json também serão removidos.`)) return;
            await deleteItem(id);
            toast('Item excluído.', 'ok');
            renderItemList();
        }
    }
