<script>
/* ===== js/encoding.js ===== */
/* ==========================================================================
   lattesZen — Camada de CODIFICAÇÃO (compatibilidade com o Lattes)
   --------------------------------------------------------------------------
   O Currículo Lattes usa ISO-8859-1 (Latin-1). Internamente o lattesZen
   trabalha com strings Unicode (JS/UTF-16) e persiste em JSON/UTF-8 — o que é
   lossless. As conversões acontecem nas BORDAS:

     ENTRADA  (import XML):  bytes ISO-8859-1 → string Unicode  (decodeBuffer)
     SAÍDA    (export XML):  string Unicode  → bytes ISO-8859-1 (encodeLatin1Xml)

   Como um documento ISO-8859-1 não representa caracteres acima de U+00FF,
   na saída esses caracteres são emitidos como ENTIDADES NUMÉRICAS XML (&#N;),
   que são válidas independentemente do encoding do documento. Também há um
   normalizador de pontuação (aspas curvas, travessão, reticências…) para
   manter o texto limpo e reduzir o uso de entidades.
   ========================================================================== */
window.LzEncoding = (function () {

    /* ----------------------------- ENTRADA ------------------------------- */
    // Detecta o encoding declarado no cabeçalho XML (default utf-8) e decodifica.
    function detectEncoding(buffer) {
        const head = new TextDecoder('ascii').decode(new Uint8Array(buffer.slice(0, 200)));
        const m = head.match(/encoding=["']([^"']+)["']/i);
        return (m ? m[1] : 'utf-8').toLowerCase();
    }
    function decodeBuffer(buffer, encoding) {
        const enc = encoding || detectEncoding(buffer);
        try { return new TextDecoder(enc).decode(buffer); }
        catch (_) { return new TextDecoder('iso-8859-1').decode(buffer); }
    }
    async function decodeXmlFile(file) {
        return decodeBuffer(await file.arrayBuffer());
    }

    /* --------------------------- NORMALIZAÇÃO ---------------------------- */
    // Mapeia pontuação Unicode comum para equivalentes representáveis em Latin-1.
    const NORM = {
        '‘': "'", '’': "'", '‚': "'", '‛': "'",   // aspas simples curvas
        '“': '"', '”': '"', '„': '"', '‟': '"',   // aspas duplas curvas
        '–': '-', '—': '-', '―': '-', '−': '-',   // travessões / menos
        '…': '...',                                              // reticências
        ' ': ' ', ' ': ' ', ' ': ' ',                  // espaços especiais
        '•': '-', 'ʼ': "'", '⁄': '/',
    };
    const NORM_RE = new RegExp('[' + Object.keys(NORM).join('') + ']', 'g');
    function normalizePunctuation(s) {
        return String(s == null ? '' : s).replace(NORM_RE, c => NORM[c] || c);
    }

    /* ----------------------------- VALIDAÇÃO ----------------------------- */
    // Retorna a lista de caracteres fora do ISO-8859-1 (code point > 255).
    function findNonLatin1(s) {
        const out = [];
        for (const ch of String(s == null ? '' : s)) {
            const cp = ch.codePointAt(0);
            if (cp > 255) out.push({ ch, cp });
        }
        return out;
    }
    function isLatin1Compatible(s) { return findNonLatin1(s).length === 0; }

    /* ------------------------------ SAÍDA -------------------------------- */
    // Escapa caracteres reservados de XML.
    function xmlEscape(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&apos;');
    }
    // String Unicode → string cujos caracteres são todos ≤ U+00FF (os demais
    // viram entidade numérica &#N;), pronta para virar bytes Latin-1.
    function toLatin1XmlString(s) {
        let out = '';
        for (const ch of String(s == null ? '' : s)) {
            const cp = ch.codePointAt(0);
            out += cp > 255 ? `&#${cp};` : ch;
        }
        return out;
    }
    // Empacota uma string (já ≤255 por caractere) em bytes ISO-8859-1.
    function latin1Bytes(s) {
        const bytes = new Uint8Array(s.length);
        for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i) & 0xFF;
        return bytes;
    }
    // Conversor de SAÍDA completo: texto Unicode → Uint8Array em ISO-8859-1
    // (com entidades numéricas para o que estiver fora do Latin-1).
    function encodeLatin1Xml(s) {
        return latin1Bytes(toLatin1XmlString(s));
    }
    // Serializa um documento XML inteiro para Blob ISO-8859-1 (uso futuro no
    // exportador para o Lattes). Recebe a string XML já montada.
    function xmlBlobLatin1(xmlString) {
        return new Blob([encodeLatin1Xml(xmlString)], { type: 'application/xml' });
    }

    return {
        // entrada
        detectEncoding, decodeBuffer, decodeXmlFile,
        // normalização / validação
        normalizePunctuation, findNonLatin1, isLatin1Compatible,
        // saída
        xmlEscape, toLatin1XmlString, latin1Bytes, encodeLatin1Xml, xmlBlobLatin1,
    };
})();

</script>

window.LattesTypes = (function () {
    const catByKey = {};
    LATTES_CATEGORIES.forEach(c => { catByKey[c.key] = c; });
    catByKey['NAO_LATTES'] = { num: '00', key: 'NAO_LATTES', label: 'Não-Lattes', icon: 'fa-heart' };

    const BACKUP_FOLDER = '00 - Backup';

    function slugFolder(cat) {
        // Nome de pasta seguro para o sistema de arquivos, legível e ordenável
        const safe = (cat.label || cat.key).replace(/[\\/:*?"<>|]/g, '').trim();
        return `${cat.num || '00'} - ${safe}`;
    }

    // Title Case pt-BR (iniciais maiúsculas, conectores em minúsculas)
    const TC_MINOR = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'em', 'a', 'o', 'ao', 'aos', 'à', 'às', 'com', 'por', 'para', 'sem', 'sob', 'entre', 'no', 'na', 'nos', 'nas', 'ou']);
    function titleCasePt(s) {
        const toks = String(s == null ? '' : s).toLowerCase().split(/(\s+|\/|-)/);
        let first = true;
        return toks.map(t => {
            if (t === '' || /^\s+$/.test(t) || t === '-') return t;
            if (t === '/') { first = true; return t; }
            const res = (!first && TC_MINOR.has(t)) ? t : t.replace(/\p{L}/u, c => c.toUpperCase());
            first = false;
            return res;
        }).join('');
    }

    return {
        categories: LATTES_CATEGORIES,
        naoLattes: NAO_LATTES_TYPE,
        backupFolder() { return BACKUP_FOLDER; },
        getType(typeKey) { return TYPES[typeKey] || (typeKey === 'NAO_LATTES' ? NAO_LATTES_TYPE : null); },
        // compat: get() devolve o tipo (independe de categoria)
        get(typeKey) { return this.getType(typeKey); },
        label(typeKey) { const t = this.getType(typeKey); return t ? t.label : typeKey; },
        categoryByKey(catKey) { return catByKey[catKey] || null; },
        categoryLabel(catKey) { const c = catByKey[catKey]; return c ? c.label : (catKey || ''); },
        categoryNumLabel(catKey) { const c = catByKey[catKey]; return c ? `${c.num ? c.num + '. ' : ''}${c.label}` : (catKey || ''); },
        // Itens legados 'NAO_LATTES' vão para a pasta de Atividades livres (99)
        categoryFolder(catKey) {
            if (catKey === 'NAO_LATTES') return slugFolder(catByKey['ATIVIDADES_LIVRES']);
            const c = catByKey[catKey]; return c ? slugFolder(c) : '99 - Outros';
        },
        primaryCategory(typeKey) { return PRIMARY_CATEGORY[typeKey] || 'PRODUCOES'; },
        normalizeType(typeKey) { return LEGACY_TYPE[typeKey] || typeKey; },
        isNaoLattesCategory(catKey) { return catKey === 'NAO_LATTES' || !!(catByKey[catKey] && catByKey[catKey].naoLattes); },
        isSingleton(typeKey) { const t = this.getType(typeKey); return !!(t && t.singleton); },
        // Pastas criadas no diretório: as 12 categorias + a pasta de Backup
        allFolders() { return LATTES_CATEGORIES.map(slugFolder).concat(BACKUP_FOLDER); },
        itemTitle(item) {
            const f = item.fields || {};
            // Formação acadêmica/titulação: exibe "anoInicio-anoFim Nível · Curso"
            // (o campo "titulo" guarda o TCC/dissertação/tese, não serve de rótulo).
            if (item.typeKey === 'FORMACAO_ACADEMICA') {
                const ini = String(f.anoInicio || '').trim();
                const fim = String(f.anoFim || '').trim();
                const periodo = (ini && fim) ? `${ini}-${fim}` : (ini || fim || '');
                const resto = [f.nivel, f.curso].map(x => String(x || '').trim()).filter(Boolean).join(' · ');
                const t = [periodo, resto].filter(Boolean).join(' ');
                if (t) return t;
            }
            // Áreas de atuação: hierarquia CNPq/CAPES (Grande área › Área › Subárea › Especialidade)
            if (item.typeKey === 'AREA_ATUACAO') {
                const partes = [f.grandeArea, f.area, f.subarea, f.especialidade].map(x => String(x || '').trim()).filter(Boolean);
                if (partes.length) return partes.map(titleCasePt).join(' › ');
                if (f.areaConhecimento) return titleCasePt(f.areaConhecimento);
            }
            return f.titulo || f.curso || f.orientando || f.candidato || f.instituicao || f.nome || '(sem título)';
        },
    };
})();

<script>
/* ===== js/storage.js ===== */
/* ==========================================================================
   lattesZen — Camada de armazenamento
   --------------------------------------------------------------------------
   - Índice do catálogo: localStorage (chave lz_catalog) — funciona sempre.
   - Arquivos (ID.pdf / ID.json): File System Access API, num diretório
     escolhido pelo usuário e persistido no IndexedDB (o handle é
     estruturável-clonável e sobrevive entre sessões, mediante permissão).
   ========================================================================== */
window.Storage = (function () {
    const K = APP_CONFIG.storageKeys;
    const IDB_NAME = 'lattesZen';
    const IDB_STORE = 'handles';
    const IDB_KEY = 'dirHandle';

    /* ---------------- IndexedDB (guarda o handle do diretório) ------------- */
    function idb() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(IDB_NAME, 1);
            req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }
    async function idbSet(key, val) {
        const db = await idb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).put(val, key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }
    async function idbGet(key) {
        const db = await idb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readonly');
            const r = tx.objectStore(IDB_STORE).get(key);
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
        });
    }
    async function idbDel(key) {
        const db = await idb();
        return new Promise((resolve, reject) => {
            const tx = db.transaction(IDB_STORE, 'readwrite');
            tx.objectStore(IDB_STORE).delete(key);
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    /* -------------------------- Diretório (FS Access) --------------------- */
    let dirHandle = null;

    const supportsFS = 'showDirectoryPicker' in window;

    async function verifyPermission(handle, readWrite = true) {
        const opts = { mode: readWrite ? 'readwrite' : 'read' };
        if ((await handle.queryPermission(opts)) === 'granted') return true;
        if ((await handle.requestPermission(opts)) === 'granted') return true;
        return false;
    }

    async function chooseDirectory() {
        if (!supportsFS) throw new Error('Navegador sem suporte à File System Access API (use Chrome ou Edge).');
        const handle = await window.showDirectoryPicker({ mode: 'readwrite' });
        dirHandle = handle;
        await idbSet(IDB_KEY, handle);
        return handle;
    }

    // Restaura o handle salvo (sem pedir permissão automaticamente)
    async function restoreDirectory() {
        if (!supportsFS) return null;
        const handle = await idbGet(IDB_KEY);
        if (handle) dirHandle = handle;
        return handle || null;
    }

    async function ensureDirReady() {
        if (!dirHandle) throw new Error('Nenhum diretório configurado. Vá em Configurações e escolha uma pasta.');
        const ok = await verifyPermission(dirHandle, true);
        if (!ok) throw new Error('Permissão de escrita negada para o diretório.');
        return dirHandle;
    }

    function hasDirectory() { return !!dirHandle; }
    async function directoryName() { return dirHandle ? dirHandle.name : null; }

    async function forgetDirectory() {
        dirHandle = null;
        await idbDel(IDB_KEY);
    }

    /* -------------------------- Escrita de arquivos ---------------------- */
    // Cria os subdiretórios (um por categoria) dentro da pasta escolhida
    async function ensureSubdirs(names) {
        const dir = await ensureDirReady();
        for (const name of names) {
            try { await dir.getDirectoryHandle(name, { create: true }); } catch (_) {}
        }
    }

    // Resolve o diretório-alvo: a raiz ou um subdiretório (criado se necessário)
    async function targetDir(subdir) {
        const dir = await ensureDirReady();
        if (!subdir) return dir;
        return dir.getDirectoryHandle(subdir, { create: true });
    }

    async function writeFile(filename, data, subdir) {
        const dir = await targetDir(subdir);
        const fh = await dir.getFileHandle(filename, { create: true });
        const w = await fh.createWritable();
        await w.write(data);
        await w.close();
    }

    async function writeJson(id, obj, subdir) {
        await writeFile(`${id}.json`, JSON.stringify(obj, null, 2), subdir);
    }

    const ATTACH_EXTS = ['pdf', 'jpg', 'jpeg', 'png'];

    // Grava um anexo (evidência) com base name explícito: <basename>.<ext>.
    // Remove versões anteriores do MESMO basename com outra extensão.
    async function writeAttachment(basename, fileOrBlob, subdir, ext) {
        ext = (ext || 'pdf').toLowerCase();
        for (const e of ATTACH_EXTS) if (e !== ext) {
            try { const d = await targetDir(subdir); await d.removeEntry(`${basename}.${e}`); } catch (_) {}
        }
        await writeFile(`${basename}.${ext}`, fileOrBlob, subdir);
    }

    // Remove um anexo específico (todas as extensões daquele basename).
    async function deleteEntry(basename, subdir) {
        if (!dirHandle) return;
        let dir = dirHandle;
        if (subdir) { try { dir = await dirHandle.getDirectoryHandle(subdir); } catch (_) { return; } }
        for (const ext of ATTACH_EXTS) {
            try { await dir.removeEntry(`${basename}.${ext}`); } catch (_) {}
        }
    }

    // Remove todos os arquivos de um item: <id>.json, <id>.<ext> e <id>-*.<ext>.
    async function deleteItemFiles(id, subdir) {
        if (!dirHandle) return;
        let dir = dirHandle;
        if (subdir) { try { dir = await dirHandle.getDirectoryHandle(subdir); } catch (_) { return; } }
        const rm = [];
        for await (const [name, h] of dir.entries()) {
            if (h.kind !== 'file') continue;
            if (name === `${id}.json`) { rm.push(name); continue; }
            const m = name.match(/^(.*)\.([^.]+)$/);
            if (!m) continue;
            const base = m[1], ext = m[2].toLowerCase();
            if ((base === id || base.indexOf(id + '-') === 0) && ATTACH_EXTS.includes(ext)) rm.push(name);
        }
        for (const n of rm) { try { await dir.removeEntry(n); } catch (_) {} }
    }

    async function readAttachmentUrl(basename, subdir, ext) {
        const dir = await ensureDirReady();
        let target = dir;
        if (subdir) { try { target = await dir.getDirectoryHandle(subdir); } catch (_) { return null; } }
        const tryExts = ext ? [ext.toLowerCase()] : ATTACH_EXTS;
        for (const e of tryExts) {
            try {
                const fh = await target.getFileHandle(`${basename}.${e}`);
                const file = await fh.getFile();
                return URL.createObjectURL(file);
            } catch (_) { /* tenta próxima */ }
        }
        return null;
    }

    // Reconstrói o catálogo a partir dos *.json (raiz e subdiretórios de categoria)
    async function scanDirectory() {
        const dir = await ensureDirReady();
        const items = [];
        async function scanOne(handle) {
            for await (const [name, h] of handle.entries()) {
                if (h.kind === 'file' && name.toLowerCase().endsWith('.json') && name !== 'catalogo.json' && name.indexOf('latteszen-') !== 0) {
                    try {
                        const file = await h.getFile();
                        const obj = JSON.parse(await file.text());
                        if (obj && obj.id) items.push(obj);
                    } catch (_) { /* ignora inválidos */ }
                } else if (h.kind === 'directory') {
                    try { await scanOne(h); } catch (_) {}
                }
            }
        }
        await scanOne(dir);
        return items;
    }

    /* ----------------------- Catálogo (localStorage) --------------------- */
    function loadCatalog() {
        try { return JSON.parse(localStorage.getItem(K.catalog)) || []; }
        catch (_) { return []; }
    }
    function saveCatalog(items) {
        localStorage.setItem(K.catalog, JSON.stringify(items));
    }

    /* ----------------------- Configurações gerais ------------------------ */
    function loadSettings() {
        try { return JSON.parse(localStorage.getItem(K.settings)) || {}; }
        catch (_) { return {}; }
    }
    function saveSettings(s) {
        localStorage.setItem(K.settings, JSON.stringify(s));
    }

    return {
        supportsFS,
        // diretório
        chooseDirectory, restoreDirectory, ensureDirReady, hasDirectory,
        directoryName, forgetDirectory, verifyPermission,
        // arquivos
        writeJson, writeAttachment, deleteEntry, deleteItemFiles, readAttachmentUrl, scanDirectory, ensureSubdirs,
        // catálogo + settings
        loadCatalog, saveCatalog, loadSettings, saveSettings,
    };
})();

</script>
<script>
/* ===== js/lattes-xml.js ===== */
/* ==========================================================================
   lattesZen — Importador do XML do Currículo Lattes
   --------------------------------------------------------------------------
   Faz o parse do XML exportado pela Plataforma Lattes (CNPq) e mapeia as
   seções para os tipos internos (lattes-types.js). Nomes de tags e atributos
   seguem o schema oficial CurriculoLattes (ver CurriculoLattes.xsd).

   Estratégia: cada tipo-folha tem exatamente um grupo "DADOS-BASICOS-*" e um
   "DETALHAMENTO-*"; localizamos esses grupos por PREFIXO, o que evita
   enumerar dezenas de nomes de grupo. Título/ano/DOI variam de nome por
   seção, então usamos listas de candidatos.
   ========================================================================== */
window.LattesXML = (function () {

    /* ------------------------------ helpers ------------------------------ */
    function attrs(el) {
        const o = {};
        if (!el) return o;
        for (const a of el.attributes) o[a.name] = a.value;
        return o;
    }
    function firstTag(el, tag) { return el ? (el.getElementsByTagName(tag)[0] || null) : null; }
    // Atributos do primeiro filho DIRETO cujo nome começa com `prefix`
    function groupByPrefix(el, prefix) {
        if (!el) return {};
        for (const c of el.children) {
            if (c.tagName && c.tagName.indexOf(prefix) === 0) return attrs(c);
        }
        return {};
    }
    function pick(obj, ...keys) {
        for (const k of keys) if (obj[k] != null && obj[k] !== '') return obj[k];
        return '';
    }
    function paginas(d) {
        return [d['PAGINA-INICIAL'], d['PAGINA-FINAL']].filter(Boolean).join('-');
    }
    function humanize(v) {
        return v ? v.replace(/_/g, ' ').toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()) : '';
    }

    const TITLE_KEYS = ['TITULO-DO-ARTIGO', 'TITULO-DO-LIVRO', 'TITULO-DO-CAPITULO-DO-LIVRO',
        'TITULO-DO-TRABALHO-TECNICO', 'TITULO-DO-TRABALHO', 'TITULO-DO-TEXTO', 'TITULO-DO-SOFTWARE',
        'TITULO-DO-PRODUTO', 'TITULO-DO-PROCESSO', 'DENOMINACAO', 'TITULO'];
    const YEAR_KEYS = ['ANO-DO-ARTIGO', 'ANO-DO-TRABALHO', 'ANO-DO-TEXTO', 'ANO', 'ANO-DESENVOLVIMENTO',
        'ANO-SOLICITACAO', 'ANO-DA-PREMIACAO', 'ANO-DE-OBTENCAO-DO-TITULO', 'ANO-DE-CONCLUSAO'];

    function titleOf(b) { return pick(b, ...TITLE_KEYS); }
    function yearOf(b) { return pick(b, ...YEAR_KEYS); }

    // Coleta autores (grupo repetível AUTORES)
    function autoresOf(el) {
        const nomes = [];
        for (const a of el.getElementsByTagName('AUTORES')) {
            const at = attrs(a);
            const n = at['NOME-COMPLETO-DO-AUTOR'] || at['NOME-PARA-CITACAO'];
            if (n) nomes.push(n);
        }
        return nomes.join('; ');
    }

    /* ---------------------- mapas de enumeração --------------------------- */
    const PROF_MAP = { BEM: 'Bom', RAZOAVELMENTE: 'Razoável', POUCO: 'Pouco' };
    const NAT_TRABALHO = { COMPLETO: 'Completo', RESUMO: 'Resumo', RESUMO_EXPANDIDO: 'Resumo expandido' };
    const NAT_LIVRO = { LIVRO_PUBLICADO: 'Livro publicado', LIVRO_ORGANIZADO_OU_EDICAO: 'Livro organizado' };

    const ORIENT_MAP = {
        'ORIENTACOES-CONCLUIDAS-PARA-MESTRADO':          { tipo: 'Mestrado', situacao: 'Concluída' },
        'ORIENTACOES-CONCLUIDAS-PARA-DOUTORADO':         { tipo: 'Doutorado', situacao: 'Concluída' },
        'ORIENTACOES-CONCLUIDAS-PARA-POS-DOUTORADO':     { tipo: 'Pós-Doutorado', situacao: 'Concluída' },
        'OUTRAS-ORIENTACOES-CONCLUIDAS':                 { tipo: 'Outra', situacao: 'Concluída' },
        'ORIENTACAO-EM-ANDAMENTO-DE-MESTRADO':           { tipo: 'Mestrado', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-DOUTORADO':          { tipo: 'Doutorado', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-POS-DOUTORADO':      { tipo: 'Pós-Doutorado', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-APERFEICOAMENTO-ESPECIALIZACAO': { tipo: 'Especialização / Monografia', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-GRADUACAO':          { tipo: 'TCC / Graduação', situacao: 'Em andamento' },
        'ORIENTACAO-EM-ANDAMENTO-DE-INICIACAO-CIENTIFICA': { tipo: 'Iniciação científica', situacao: 'Em andamento' },
        'OUTRAS-ORIENTACOES-EM-ANDAMENTO':               { tipo: 'Outra', situacao: 'Em andamento' },
    };

    const PARTIC_MAP = {
        'PARTICIPACAO-EM-CONGRESSO': 'Congresso', 'PARTICIPACAO-EM-FEIRA': 'Feira',
        'PARTICIPACAO-EM-SEMINARIO': 'Seminário', 'PARTICIPACAO-EM-SIMPOSIO': 'Simpósio',
        'PARTICIPACAO-EM-OFICINA': 'Oficina', 'PARTICIPACAO-EM-ENCONTRO': 'Encontro',
        'PARTICIPACAO-EM-EXPOSICAO': 'Exposição', 'PARTICIPACAO-EM-OLIMPIADA': 'Olimpíada',
        'OUTRAS-PARTICIPACOES-EM-EVENTOS-CONGRESSOS': 'Outro',
    };

    const BANCA_MAP = {
        'PARTICIPACAO-EM-BANCA-DE-MESTRADO': 'Mestrado',
        'PARTICIPACAO-EM-BANCA-DE-DOUTORADO': 'Doutorado',
        'PARTICIPACAO-EM-BANCA-DE-EXAME-QUALIFICACAO': 'Qualificação',
        'PARTICIPACAO-EM-BANCA-DE-APERFEICOAMENTO-ESPECIALIZACAO': 'Especialização / Aperfeiçoamento',
        'PARTICIPACAO-EM-BANCA-DE-GRADUACAO': 'TCC / Graduação',
        'OUTRAS-PARTICIPACOES-EM-BANCA': 'Outra',
        'BANCA-JULGADORA-PARA-PROFESSOR-TITULAR': 'Professor titular',
        'BANCA-JULGADORA-PARA-CONCURSO-PUBLICO': 'Concurso público',
        'BANCA-JULGADORA-PARA-LIVRE-DOCENCIA': 'Livre-docência',
        'BANCA-JULGADORA-PARA-AVALIACAO-CURSOS': 'Avaliação de cursos',
        'OUTRAS-BANCAS-JULGADORAS': 'Outra',
    };

    const FORMACAO_MAP = {
        'GRADUACAO': 'Graduação', 'ESPECIALIZACAO': 'Especialização', 'APERFEICOAMENTO': 'Aperfeiçoamento',
        'MESTRADO': 'Mestrado', 'MESTRADO-PROFISSIONALIZANTE': 'Mestrado',
        'DOUTORADO': 'Doutorado', 'POS-DOUTORADO': 'Pós-Doutorado',
        'LIVRE-DOCENCIA': 'Livre-docência', 'RESIDENCIA-MEDICA': 'Residência médica',
        'CURSO-TECNICO-PROFISSIONALIZANTE': 'Curso técnico',
        'ENSINO-FUNDAMENTAL-PRIMEIRO-GRAU': 'Ensino fundamental', 'ENSINO-MEDIO-SEGUNDO-GRAU': 'Ensino médio',
    };

    /* -------------------- handlers por tag (produção) -------------------- */
    // Cada handler: { tags:[...], typeKey, map(el,b,d) -> fields }
    const HANDLERS = [
        { tags: ['ARTIGO-PUBLICADO'], typeKey: 'ARTIGO_PERIODICO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), doi: b['DOI'] || '', autores: autoresOf(el),
              periodico: d['TITULO-DO-PERIODICO-OU-REVISTA'] || '', issn: d['ISSN'] || '',
              volume: d['VOLUME'] || '', fasciculo: d['FASCICULO'] || '', paginas: paginas(d),
          }) },
        { tags: ['ARTIGO-ACEITO-PARA-PUBLICACAO'], typeKey: 'ARTIGO_ACEITO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), doi: b['DOI'] || '', autores: autoresOf(el),
              periodico: d['TITULO-DO-PERIODICO-OU-REVISTA'] || '', issn: d['ISSN'] || '',
          }) },
        { tags: ['LIVRO-PUBLICADO-OU-ORGANIZADO'], typeKey: 'LIVRO_CAPITULO',
          map: (el, b, d) => ({
              tipoObra: NAT_LIVRO[b['TIPO']] || 'Livro publicado',
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              editora: d['NOME-DA-EDITORA'] || '', cidade: d['CIDADE-DA-EDITORA'] || '',
              isbn: d['ISBN'] || '', edicao: d['NUMERO-DA-EDICAO-REVISAO'] || '', paginas: d['NUMERO-DE-PAGINAS'] || '',
          }) },
        { tags: ['CAPITULO-DE-LIVRO-PUBLICADO'], typeKey: 'LIVRO_CAPITULO',
          map: (el, b, d) => ({
              tipoObra: 'Capítulo de livro',
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              tituloLivro: d['TITULO-DO-LIVRO'] || '', organizadores: d['ORGANIZADORES'] || '',
              editora: d['NOME-DA-EDITORA'] || '', isbn: d['ISBN'] || '', paginas: paginas(d),
          }) },
        { tags: ['TRABALHO-EM-EVENTOS'], typeKey: 'TRABALHO_EVENTO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), doi: b['DOI'] || '', autores: autoresOf(el),
              natureza: NAT_TRABALHO[b['NATUREZA']] || humanize(b['NATUREZA']),
              evento: d['NOME-DO-EVENTO'] || '', anais: d['TITULO-DOS-ANAIS-OU-PROCEEDINGS'] || '',
              cidade: d['CIDADE-DO-EVENTO'] || '', paginas: paginas(d),
          }) },
        { tags: ['TEXTO-EM-JORNAL-OU-REVISTA'], typeKey: 'TEXTO_JORNAL',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
              veiculo: d['TITULO-DO-JORNAL-OU-REVISTA'] || '', data: d['DATA-DE-PUBLICACAO'] || '', paginas: paginas(d),
          }) },

        // ---- Produção técnica ----
        { tags: ['SOFTWARE'], typeKey: 'SOFTWARE_SEM_REGISTRO',
          map: (el, b, d) => ({
              titulo: titleOf(b), ano: yearOf(b), autores: autoresOf(el),
