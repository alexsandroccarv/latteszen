# lattesZen — configuração do Nginx para o container (POP-004).
# Mesmas 2 pegadinhas do POP-003 (instalação nativa): MIME de
# robots.txt/sitemap.xml e cache do Service Worker.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /robots.txt { default_type text/plain; }
    location = /sitemap.xml { default_type application/xml; }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
